# Dependabot version updates. Major bumps stay ungrouped so they can be reviewed alone.
# Cargo is scoped to /engines/code-graph only; the benchmark fixture Cargo.toml under
# engines/code-graph/benchmarks is not a workspace member and is not listed.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /engines/code-graph
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Remove when rust-version moves to 1.88 (ignore 0.4.30+ needs let-chains).
    ignore:
      - dependency-name: ignore
        versions:
          - ">=0.4.30"

  - package-ecosystem: gomod
    directory: /stations/notify
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /engines/evidence-ledger
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # npm: pre-wired for the npm wrapper package (#1273). Dependabot reports a
  # config error on every run when an npm entry has no package.json, so this
  # stays commented out. Uncomment and set `directory` in the same PR that adds
  # the manifest.
  # - package-ecosystem: npm
  #   directory: /
  #   schedule:
  #     interval: weekly
  #   open-pull-requests-limit: 5
  #   labels:
  #     - dependencies
  #   commit-message:
  #     prefix: "chore(deps)"
  #   groups:
  #     minor-and-patch:
  #       patterns:
  #         - "*"
  #       update-types:
  #         - minor
  #         - patch
