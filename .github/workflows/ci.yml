name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mesh: ${{ github.event_name == 'merge_group' && 'true' || github.event_name == 'push' && 'true' || steps.filter.outputs.mesh }}
      code_graph: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.code_graph }}
      evidence_ledger: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.evidence_ledger }}
      notify: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.notify }}
      fleet_hub_container: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.fleet_hub_container }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        if: ${{ github.event_name != 'merge_group' }}
        id: filter
        with:
          filters: |
            mesh:
              - 'src/brigade/fleet_mesh_*.py'
              - 'tests/test_fleet_mesh_*.py'
              - 'tests/mesh_hpke_reference.py'
              - 'tests/fixtures/mesh/**'
              - 'docs/phase-agent-mesh.md'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            code_graph:
              - 'engines/code-graph/**'
              - 'src/brigade/templates/components/manifest-v1.json'
              - '.github/workflows/ci.yml'
            evidence_ledger:
              - 'engines/evidence-ledger/**'
              - 'src/brigade/templates/components/manifest-v1.json'
              - '.github/workflows/ci.yml'
            notify:
              - 'stations/notify/**'
              - 'src/brigade/templates/components/manifest-v1.json'
              - '.github/workflows/ci.yml'

            fleet_hub_container:
              - '.dockerignore'
              - 'ops/fleet-hub/**'
              - 'tests/fleet_hub_container_smoke.py'
              - '.github/workflows/ci.yml'

  code-graph-msrv:
    name: MSRV (Rust 1.85)
    needs: changes
    if: ${{ needs.changes.outputs.code_graph == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/code-graph
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/code-graph
      - name: Check locked all-features build
        run: cargo check --locked --all-features

  code-graph-build-and-test:
    name: build-and-test
    needs: changes
    if: ${{ needs.changes.outputs.code_graph == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/code-graph
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/code-graph
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Build (default, no-network)
        run: cargo build --release

  code-graph-feature-configurations:
    name: Feature configuration (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.code_graph == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default
            cargo_args: --no-default-features
          - name: default
            cargo_args: ""
          - name: watch-only
            cargo_args: --no-default-features --features watch
          - name: codesearch-only
            cargo_args: --no-default-features --features codesearch
          - name: miseledger-only
            cargo_args: --no-default-features --features miseledger
          - name: all-features
            cargo_args: --all-features
    defaults:
      run:
        working-directory: engines/code-graph
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/code-graph
      - name: Check locked feature configuration
        run: cargo check --locked ${{ matrix.cargo_args }}

  code-graph-windows:
    name: Windows (stable, default features)
    needs: changes
    if: ${{ needs.changes.outputs.code_graph == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engines/code-graph
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/code-graph
      - name: Test locked default features
        run: cargo test --locked

  evidence-ledger-test:
    needs: changes
    if: ${{ needs.changes.outputs.evidence_ledger == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/evidence-ledger
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test ./...
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - run: govulncheck ./...
      - run: go build -o bin/miseledger ./cmd/miseledger
      - run: go build -o bin/sessionfind ./cmd/sessionfind
      - run: scripts/check_release_workflow.sh
      - run: scripts/smoke_archive.sh
      - run: scripts/smoke_mcp.sh
      - run: scripts/smoke_http.sh

  notify-build-and-test:
    name: notify-build-and-test (ubuntu-latest)
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stations/notify
    steps:
      - name: Skip notify tests (unchanged paths)
        if: ${{ needs.changes.outputs.notify != 'true' }}
        # Override job default: checkout is gated, so stations/notify is absent.
        working-directory: ${{ github.workspace }}
        run: echo "stations/notify unchanged; required check satisfied without running Go tests."
      - uses: actions/checkout@v7
        if: ${{ needs.changes.outputs.notify == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: ${{ needs.changes.outputs.notify == 'true' }}
        with:
          go-version: '1.22'
          cache-dependency-path: stations/notify/go.sum
      - name: Build
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: go build ./...
      - name: Vet
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: go vet ./...
      - name: Test
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: go test -race ./...
      - name: Test config (GOARCH=386)
        if: ${{ needs.changes.outputs.notify == 'true' }}
        env:
          GOARCH: 386
        run: go test ./internal/config/...
      - name: Setup stable Go for govulncheck
        if: ${{ needs.changes.outputs.notify == 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: stations/notify/go.sum
      - name: Install govulncheck
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Vulncheck
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: govulncheck ./...

  notify-windows:
    name: notify-build-and-test (windows-latest)
    needs: changes
    runs-on: windows-latest
    defaults:
      run:
        working-directory: stations/notify
    steps:
      - name: Skip notify tests (unchanged paths)
        if: ${{ needs.changes.outputs.notify != 'true' }}
        # Override job default: checkout is gated, so stations/notify is absent.
        working-directory: ${{ github.workspace }}
        run: echo "stations/notify unchanged; required check satisfied without running Go tests."
      - uses: actions/checkout@v7
        if: ${{ needs.changes.outputs.notify == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: ${{ needs.changes.outputs.notify == 'true' }}
        with:
          go-version: '1.22'
          cache-dependency-path: stations/notify/go.sum
      - name: Build
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: go build ./...
      - name: Vet
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: go vet ./...
      - name: Test
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: go test -race ./...

  # Stable check name. Maintainers may require it without changing this workflow.
  # Pull requests only: a merge group reports this job as skipped, which satisfies
  # a required check, so the queue does not wait on Windows. The 45-minute driver
  # budget covers the largest selection from the last 200 main commits (257 files).
  windows-affected-tests:
    name: windows-affected-tests
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Capture job budget
        run: |
          "WINDOWS_PYTEST_JOB_STARTED_AT=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected Windows tests
        id: selection
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # GitHub tests the pull request merged into the current base tip. Diff from
          # that merge's first parent. pull_request.base.sha can trail the base branch,
          # which would count other merged pull requests as this one's changes.
          $mergeHead = git rev-parse HEAD^2
          if ($LASTEXITCODE -ne 0 -or $mergeHead -ne $env:PR_HEAD_SHA) { throw "HEAD is not the pull request test merge" }
          $base = git rev-parse HEAD^1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "base=$base" >> $env:GITHUB_OUTPUT
          # Hosted Windows includes Python. Selection uses only its standard library.
          python scripts/windows_affected_tests.py --base $base --head HEAD --output "$env:RUNNER_TEMP/windows-affected-results/files.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Driver changes exercise the hub files affected by slow FULL flushes.
          $driverChanged = git diff --name-only $base HEAD -- scripts/windows_pytest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($driverChanged) {
            $flushTests = @(
              "test_fleet_policy_page.py", "test_fleet_roster_page.py",
              "test_fleet_message_grants.py", "test_fleet_model_roster.py",
              "test_fleet_enrollment.py", "test_fleet_dashboard.py",
              "test_fleet_claim_generations.py", "test_fleet_client_message_credentials.py"
            )
            @(Get-Content "$env:RUNNER_TEMP/windows-affected-results/files.txt") + $flushTests |
              Sort-Object -Unique | Set-Content "$env:RUNNER_TEMP/windows-affected-results/files.txt"
          }
          $count = @(Get-Content "$env:RUNNER_TEMP/windows-affected-results/files.txt").Count
          "count=$count" >> $env:GITHUB_OUTPUT
      - name: Skip empty selection
        if: ${{ steps.selection.outputs.count == '0' }}
        run: Write-Output "No affected Windows tests."
      - uses: actions/setup-python@v7
        if: ${{ steps.selection.outputs.count != '0' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        if: ${{ steps.selection.outputs.count != '0' }}
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure Windows test temp drive
        run: python scripts/windows_pytest.py --configure-temp-root
      - name: Probe SQLite flush latency
        timeout-minutes: 5
        run: python scripts/windows_sqlite_flush_probe.py --samples 20 --output "$env:RUNNER_TEMP/windows-affected-results/sqlite-flush.json"
      - name: Run affected Windows tests
        if: ${{ steps.selection.outputs.count != '0' }}
        timeout-minutes: 45
        env:
          BASE_SHA: ${{ steps.selection.outputs.base }}
        run: >-
          python scripts/windows_pytest.py
          --files-from "$env:RUNNER_TEMP/windows-affected-results/files.txt"
          --record "$env:RUNNER_TEMP/windows-affected-results/summary.json"
          --base-ref $env:BASE_SHA
          --job-started-at $env:WINDOWS_PYTEST_JOB_STARTED_AT
          --job-limit 2700 --startup-reserve 120 --finalize-reserve 300
          --job-timeout 2280 --serial test_runs_serve.py --serial test_aboyeur.py
      - name: Upload affected Windows results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-affected-results
          path: ${{ runner.temp }}/windows-affected-results
          if-no-files-found: warn
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The allowlist ratchet reads the test merge's first parent on pull requests.
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff check
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy
      - name: Size ratchet baseline
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.base_ref || 'main' }}
          python scripts/check_size_ratchet_baseline.py --base-ref origin/${{ github.base_ref || 'main' }}
      - name: Resolve allowlist base
        id: allowlist-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Compare with the base tip GitHub merged into. pull_request.base.sha can
            # trail main and would blame this pull request for allowlist growth on main.
            if [ "$(git rev-parse HEAD^2 2>/dev/null)" != "$PR_HEAD_SHA" ]; then
              echo "::error::HEAD is not the pull request test merge"
              exit 1
            fi
            base=$(git rev-parse HEAD^1)
          else
            base=$EVENT_BASE_SHA
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Windows allowlist ratchet
        env:
          BASE_SHA: ${{ steps.allowlist-base.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "::error::Windows allowlist base SHA is missing"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python scripts/windows_pytest.py --check-allowlist-only --base-ref "$BASE_SHA"
      - name: Version sync
        run: python scripts/version_sync.py --check
      - name: Managed snapshot
        run: python scripts/managed_snapshot.py --check
      - name: Template profile snapshot
        run: python scripts/template_profile_snapshot.py --check

  test-shards:
    name: test shard (${{ matrix.python }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the Python 3.12 shards, which also carry coverage.
        # Merge groups and pushes to main run every supported Python, so 3.10
        # and 3.11 run on the combined change in the queue (and again on the
        # push to main) rather than on every pull request push.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.10", "3.11", "3.12"]') }}
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        if: matrix.python != '3.12'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install with grokbot extra
        if: matrix.python == '3.12'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,grokbot]"
      - name: Pytest shard
        if: matrix.python != '3.12'
        run: python scripts/ci_pytest_shard.py --shard-index "${{ matrix.shard }}" --shard-count 4 -- -q
      - name: Pytest shard with coverage
        if: matrix.python == '3.12'
        env:
          COVERAGE_CORE: sysmon
          COVERAGE_FILE: .coverage.${{ matrix.python }}.${{ matrix.shard }}
        run: python scripts/ci_pytest_shard.py --shard-index "${{ matrix.shard }}" --shard-count 4 -- -q --cov=brigade --cov-report=
      - name: Assert grokbot MCP tests run without skips
        if: matrix.python == '3.12' && matrix.shard == 0
        run: |
          output=$(python -m pytest tests/test_grokbot_mcp.py -q --no-header -p no:cacheprovider 2>&1)
          pytest_exit=$?
          echo "$output"
          if [ $pytest_exit -ne 0 ]; then
            echo "ERROR: grokbot MCP tests failed"
            exit 1
          fi
          if grep -q 'skipped' <<< "$output"; then
            echo "ERROR: grokbot MCP tests were skipped; install the grokbot extra"
            exit 1
          fi
      - name: Upload coverage data
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python }}-${{ matrix.shard }}
          path: .coverage.${{ matrix.python }}.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

  fleet-hub-container:
    needs: changes
    if: ${{ needs.changes.outputs.fleet_hub_container == 'true' }}
    name: Fleet Hub container (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and exercise the container image
        run: python tests/fleet_hub_container_smoke.py --platform "${{ matrix.platform }}"

  coverage:
    needs: test-shards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download coverage data
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-*
          path: .coverage-data
          merge-multiple: true
      - name: Combine coverage
        run: python -m coverage combine .coverage-data
      - name: Coverage report
        run: python -m coverage report --fail-under=78

  test:
    name: test (${{ matrix.python }})
    needs: [changes, test-shards, coverage, cosign-integration, fleet-hub-container]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - name: Note Python shards deferred to the merge queue
        if: ${{ github.event_name == 'pull_request' && matrix.python != '3.12' }}
        run: echo "::notice::Python ${{ matrix.python }} shards run in the merge queue, not on pull requests."
      - name: Require shards, coverage, and cosign integration
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHARDS_RESULT: ${{ needs.test-shards.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          COSIGN_RESULT: ${{ needs.cosign-integration.result }}
          FLEET_HUB_RESULT: ${{ needs.fleet-hub-container.result }}
          FLEET_HUB_REQUIRED: ${{ needs.changes.outputs.fleet_hub_container == 'true' }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "changes=$CHANGES_RESULT"
            exit 1
          fi
          if [ "$SHARDS_RESULT" != "success" ] || [ "$COVERAGE_RESULT" != "success" ] || [ "$COSIGN_RESULT" != "success" ]; then
            echo "test-shards=$SHARDS_RESULT coverage=$COVERAGE_RESULT cosign-integration=$COSIGN_RESULT fleet-hub-container=$FLEET_HUB_RESULT"
            exit 1
          fi
          if [ "$FLEET_HUB_RESULT" != "success" ]; then
            if [ "$FLEET_HUB_RESULT" != "skipped" ] || [ "$FLEET_HUB_REQUIRED" != "false" ]; then
              echo "fleet-hub-container=$FLEET_HUB_RESULT required=$FLEET_HUB_REQUIRED"
              exit 1
            fi
          fi

  # Required aggregate: ci-gate is the only required status check on main.
  # It replaced the 20 per-job contexts after the GitHub deliberate-failure
  # checks in docs/runbooks/ci-runner-pilot.md passed. Keep its needs list
  # equal to the policy set below; a mismatch fails closed.
  ci-gate:
    if: always()
    needs:
      - changes
      - lint
      - test
      - test-shards
      - coverage
      - cosign-integration
      - fleet-hub-container
      - component-manifest-provenance
      - content-guard
      - repo-metadata
      - install-from-source
      - quickstart-smoke
      - windows-native-acceptance
      - mesh-compatibility
      - mesh-cross-version
      - mesh-without-extra
    runs-on: ubuntu-latest
    steps:
      - name: Require all protected jobs and their dependencies
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os

          # Shadow policy: every current required job and dependency must
          # succeed, except a container explicitly classified as unchanged.
          # Merge groups require all components, regardless of path filtering.
          mandatory = {
              "changes", "lint", "test", "test-shards", "coverage",
              "cosign-integration", "fleet-hub-container", "component-manifest-provenance",
              "content-guard", "repo-metadata", "install-from-source",
              "quickstart-smoke", "windows-native-acceptance",
              "mesh-compatibility", "mesh-cross-version", "mesh-without-extra",
          }
          needs = json.loads(os.environ["NEEDS_JSON"])
          errors = []
          if set(needs) != mandatory:
              errors.append(
                  f"DAG mismatch: missing={mandatory - set(needs)}, "
                  f"extra={set(needs) - mandatory}"
              )
          changes = needs.get("changes", {})
          container_skip_allowed = (
              changes.get("result") == "success"
              and changes.get("outputs", {}).get("fleet_hub_container") == "false"
              and os.environ["EVENT_NAME"] != "merge_group"
          )
          mesh_jobs = {"mesh-compatibility", "mesh-cross-version", "mesh-without-extra"}
          mesh_skip_allowed = (
              changes.get("result") == "success"
              and changes.get("outputs", {}).get("mesh") == "false"
              and os.environ["EVENT_NAME"] == "pull_request"
          )
          for name in sorted(mandatory):
              result = needs.get(name, {}).get("result")
              if name == "fleet-hub-container" and result == "skipped" and container_skip_allowed:
                  continue
              if name in mesh_jobs and result == "skipped" and mesh_skip_allowed:
                  continue
              if result != "success":
                  errors.append(f"{name}: required success, got {result!r}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("All protected CI jobs and dependencies satisfied the shadow policy")
          PY

  component-manifest-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Exercise generated-release provenance contract
        run: python -m pytest tests/test_component_manifest_provenance.py -q

  cosign-integration:
    name: cosign (${{ matrix.cosign }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cosign: ["v2.6.5", "v3.1.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ matrix.cosign }}
      - name: Display cosign version
        run: cosign version
      - name: Exercise real cosign bundle verification
        run: |
          set +e
          output=$(python -m pytest tests/test_cosign_attestation.py::test_real_cosign_bundle_verifies_with_git_tree_subject -q --no-header -p no:cacheprovider 2>&1)
          pytest_exit=$?
          set -e
          echo "$output"
          if [ $pytest_exit -ne 0 ]; then
            echo "ERROR: real cosign integration test failed"
            exit 1
          fi
          if ! grep -q '1 passed' <<< "$output"; then
            echo "ERROR: real cosign integration test did not pass"
            exit 1
          fi

  content-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Scans with the guard this repo ships, not a pinned copy of the retired
      # standalone repo. Brigade has no runtime dependencies, so PYTHONPATH is
      # enough and no install step is needed. --baseline accepts the findings
      # recorded in .content-guard-baseline.json (synthetic fixtures, example
      # hosts) so the gate fails on NEW leakage only.
      - name: Scan
        run: |
          PYTHONPATH=src python -m brigade.guard audit . \
            --scope tracked \
            --strict \
            --baseline .content-guard-baseline.json

  repo-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Command Inventory
        run: |
          set +e
          brigade roadmap commands --check
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error file=docs/command-inventory.md::docs/command-inventory.md is stale; regenerate with BRIGADE_EXTRAS=1 brigade roadmap commands --write"
          fi
          exit "$status"
        env:
          BRIGADE_EXTRAS: "1"
      - name: Roadmap Version
        run: |
          if [ ! -f ROADMAP.md ]; then
            echo "::error file=ROADMAP.md::ROADMAP.md is missing; this repo must ship a roadmap with a **vX.Y.x on main** headline"
            exit 1
          fi
          set +e
          brigade roadmap audit --check
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error file=ROADMAP.md::ROADMAP.md version headline is stale or unparseable; update the Where things stand headline to **vX.Y.x on main** matching pyproject.toml major.minor"
          fi
          exit "$status"
        env:
          BRIGADE_EXTRAS: "1"
      - name: Template Audit
        run: brigade security template-audit --target . --json

  install-from-source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        combo:
          - name: "repo+claude"
            flags: "--depth repo --harnesses claude"
          - name: "repo+codex"
            flags: "--depth repo --harnesses codex"
          - name: "workspace+claude+openclaw"
            flags: "--depth workspace --harnesses claude,openclaw"
          - name: "workspace+codex+openclaw"
            flags: "--depth workspace --harnesses codex,openclaw"
          - name: "workspace+hermes"
            flags: "--depth workspace --harnesses hermes"
          - name: "kitchen-sink"
            flags: "--depth workspace --harnesses claude,codex,openclaw,hermes"
          - name: "workspace+none"
            flags: "--depth workspace --harnesses none"
          - name: "repo+claude+publisher"
            flags: "--depth repo --harnesses claude --include publisher"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pipx install
        run: |
          python -m pip install --upgrade pip pipx
          pipx install .
          brigade --version
      - name: Init + doctor
        run: |
          target="$(mktemp -d)"
          git init -q -b main "$target"
          brigade init --target "$target" ${{ matrix.combo.flags }}
          brigade doctor --target "$target"
          case "${{ matrix.combo.flags }}" in
            *hermes*)
              test -f "$target/.hermes/memory-handoffs/TEMPLATE.md"
              test -d "$target/.hermes/memory-handoffs/processed"
              test -f "$target/.brigade/hermes/workspace.harness.json"
              test -f "$target/.brigade/hermes/memory-handoff.harness.json"
              grep -q '"handoff_inbox": ".hermes/memory-handoffs"' "$target/.brigade/hermes/workspace.harness.json"
              grep -q '"inbox_dir": ".hermes/memory-handoffs"' "$target/.brigade/hermes/memory-handoff.harness.json"
              ! grep -R '.claude/memory-handoffs' "$target/.brigade/hermes"
              brigade handoff sources init --target "$target" --force
              brigade handoff draft --target "$target" --inbox hermes \
                --title "Hermes CI smoke" \
                --summary "Hermes can write a local Brigade handoff." \
                --content "### Hermes CI smoke

          The Hermes inbox follows the shared Brigade handoff contract."
              brigade operator verify-harness --harness hermes --target "$target"
              ;;
          esac

  quickstart-smoke:
    name: quickstart-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pipx install
        run: |
          python -m pip install --upgrade pip pipx
          pipx install .
          brigade --version
      - name: Quickstart (minimal default, Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          target="$(mktemp -d)"
          git init -q -b main "$target"
          brigade operator quickstart --target "$target" --harnesses codex --json
          brigade operator doctor --target "$target" --profile local-operator --json
          test -f "$target/.brigade/config.json"
          test -d "$target/.codex/memory-handoffs"
          test -f "$target/.codex/skills/brigade-work/SKILL.md"
          test -f "$target/AGENTS.md"
          test ! -e "$target/tools"
          test ! -e "$target/rules"
          test ! -e "$target/INSTALL_FOR_AGENTS.md"
      - name: Quickstart (minimal default, PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "brigade-quickstart-minimal"
          git init -q -b main $target
          brigade operator quickstart --target $target --harnesses codex --json
          brigade operator doctor --target $target --profile local-operator --json
          if (-not (Test-Path (Join-Path $target ".brigade/config.json"))) { throw "missing Brigade config" }
          if (-not (Test-Path (Join-Path $target ".codex/memory-handoffs"))) { throw "missing Codex handoff inbox" }
          if (-not (Test-Path (Join-Path $target ".codex/skills/brigade-work/SKILL.md"))) { throw "missing brigade-work skill" }
          if (-not (Test-Path (Join-Path $target "AGENTS.md"))) { throw "missing AGENTS.md" }
          if (Test-Path (Join-Path $target "tools")) { throw "minimal install unexpectedly created tools" }
          if (Test-Path (Join-Path $target "rules")) { throw "minimal install unexpectedly created rules" }
          if (Test-Path (Join-Path $target "INSTALL_FOR_AGENTS.md")) { throw "minimal install unexpectedly created full-kit guide" }
      - name: Quickstart (--full, Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          target="$(mktemp -d)"
          git init -q -b main "$target"
          brigade operator quickstart --target "$target" --harnesses codex --full --json
          brigade operator doctor --target "$target" --profile local-operator --json
          test -f "$target/.codex/skills/frontend/SKILL.md"
          test -f "$target/tools/antislop.md"
          test -f "$target/INSTALL_FOR_AGENTS.md"
          test -f "$target/rules/issue-tdd-loop.md"
      - name: Quickstart (--full, PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "brigade-quickstart-full"
          git init -q -b main $target
          brigade operator quickstart --target $target --harnesses codex --full --json
          brigade operator doctor --target $target --profile local-operator --json
          if (-not (Test-Path (Join-Path $target ".codex/skills/frontend/SKILL.md"))) { throw "missing frontend skill" }
          if (-not (Test-Path (Join-Path $target "tools/antislop.md"))) { throw "missing antislop tool" }
          if (-not (Test-Path (Join-Path $target "INSTALL_FOR_AGENTS.md"))) { throw "missing full-kit guide" }
          if (-not (Test-Path (Join-Path $target "rules/issue-tdd-loop.md"))) { throw "missing issue/TDD rule" }

  # Optional capacity probe. Existing protected checks remain hosted.
  trusted-runner-canary:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.BRIGADE_SELF_HOSTED == 'on' }}
    runs-on:
      group: brigade-trusted
      labels: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Smoke source CLI in a temporary workspace
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python3 -m brigade --version
          target="$(mktemp -d)"
          trap 'rm -rf "$target"' EXIT
          git init -q -b main "$target"
          python3 -m brigade init --target "$target" --depth workspace --harnesses claude,codex
          python3 -m brigade doctor --target "$target"

  windows-native-acceptance:
    name: windows-native-acceptance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Configure Windows test temp drive
        shell: pwsh
        run: python scripts/windows_pytest.py --configure-temp-root
      - name: Probe SQLite flush latency
        shell: pwsh
        timeout-minutes: 5
        run: python scripts/windows_sqlite_flush_probe.py --samples 20 --output "$env:RUNNER_TEMP/windows-native-sqlite-flush.json"
      - name: Upload SQLite flush diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-sqlite-flush
          path: ${{ runner.temp }}/windows-native-sqlite-flush.json
          if-no-files-found: warn
          retention-days: 7
      - name: Install containment test dependencies
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "containment-venv"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "containment venv creation failed" }
          $python = Join-Path $venv "Scripts/python.exe"
          & $python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "containment test install failed" }
      - name: Run native Windows process containment
        shell: pwsh
        run: |
          $python = Join-Path $env:RUNNER_TEMP "containment-venv/Scripts/python.exe"
          @'
          import os
          import sys
          import pytest
          assert os.name == "nt", "native Windows runner required"
          class NoNativeSkips:
              skipped = False
              def pytest_runtest_logreport(self, report):
                  self.skipped |= report.skipped
              def pytest_collectreport(self, report):
                  self.skipped |= report.skipped
          guard = NoNativeSkips()
          result = pytest.main(["-q", "-ra", "-o", "addopts=", "tests/test_windows_job.py::TestNativeContainment", "tests/test_skills_state_windows.py", "tests/test_claude_hooks_state_containment.py", "tests/test_dirfd.py::test_fsync_directory_accepts_native_windows_directory_handles", "tests/test_fleet_claim_loss_cancellation.py::test_native_windows_claim_loss_stops_silent_worker"], plugins=[guard])
          sys.exit(1 if guard.skipped else int(result))
          '@ | & $python -
          if ($LASTEXITCODE -ne 0) { throw "native containment failed or skipped" }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/code-graph
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build same-commit native engines
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path engine-bin | Out-Null
          Push-Location engines/code-graph
          cargo build --release --locked --bin graphtrail --bin graphtrail-mcp
          if ($LASTEXITCODE -ne 0) { throw "graphtrail build failed" }
          Copy-Item target/release/graphtrail.exe "$env:GITHUB_WORKSPACE/engine-bin/graphtrail.exe"
          Copy-Item target/release/graphtrail-mcp.exe "$env:GITHUB_WORKSPACE/engine-bin/graphtrail-mcp.exe"
          Pop-Location
          Push-Location engines/evidence-ledger
          $env:CGO_ENABLED = "0"
          go build -trimpath -o "$env:GITHUB_WORKSPACE/engine-bin/miseledger.exe" ./cmd/miseledger
          if ($LASTEXITCODE -ne 0) { throw "miseledger build failed" }
          go build -trimpath -o "$env:GITHUB_WORKSPACE/engine-bin/sessionfind.exe" ./cmd/sessionfind
          if ($LASTEXITCODE -ne 0) { throw "sessionfind build failed" }
          Pop-Location
      - name: Run Windows native acceptance (source install)
        shell: powershell
        run: |
          & "${{ github.workspace }}\scripts\windows-native-acceptance.ps1" -InstallMode source -RepoRoot "${{ github.workspace }}" -EngineBinDir "${{ github.workspace }}\engine-bin"
      - name: Native two-process journal lock regressions
        shell: pwsh
        run: |
          foreach ($key in @("CURSOR_API_KEY", "CURSOR_CLOUD_API_KEY", "BG_AGENT_API_KEY", "JULES_API_KEY")) {
            Remove-Item "Env:$key" -ErrorAction SilentlyContinue
          }
          $venv = Join-Path $env:RUNNER_TEMP "journal-lock-venv"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "journal lock venv creation failed" }
          $python = Join-Path $venv "Scripts/python.exe"
          & $python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "journal lock dev install failed" }
          & $python -m pytest -q tests/test_run_journal.py::test_windows_journal_lock_excludes_unbound_mutation_during_bound_tail_window
          if ($LASTEXITCODE -ne 0) { throw "native journal lock regressions failed" }

  pr-tier-shadow:
    name: PR test tiers (shadow observation)
    needs: test-shards
    if: ${{ always() && github.event_name == 'pull_request' && github.repository != '' && github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - name: Prefetch full evidence before PR code
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: |
          python3 -I -S - <<'PY'
          from datetime import datetime, timezone
          from http.client import HTTPException
          import json
          import os
          from pathlib import Path
          import re
          import time
          from urllib.error import HTTPError
          from urllib.parse import urlparse
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          TRIAL_START = datetime(2026, 10, 23, tzinfo=timezone.utc)
          TRIAL_EXPIRY = datetime(2026, 11, 6, tzinfo=timezone.utc)
          SHARD_NAMES = [f"test shard (3.12, {index})" for index in range(4)]
          output = Path(os.environ["RUNNER_TEMP"]) / "pr-tier-full"
          output.mkdir(parents=True, exist_ok=True)
          errors = []
          deadline = time.monotonic() + 240

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = build_opener(NoRedirect())

          def read_response(request, limit):
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise TimeoutError("prefetch deadline exceeded")
              with opener.open(request, timeout=min(30, remaining)) as response:
                  chunks = []
                  size = 0
                  while True:
                      if time.monotonic() >= deadline:
                          raise TimeoutError("prefetch deadline exceeded")
                      chunk = response.read(min(65536, limit + 1 - size))
                      if not chunk:
                          return b"".join(chunks)
                      chunks.append(chunk)
                      size += len(chunk)
                      if size > limit:
                          raise ValueError("response size exceeded")

          def api_get(path, *, logs=False):
              request = Request("https://api.github.com" + path, headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              })
              try:
                  return read_response(request, 64 * 1024 * 1024 if logs else 4 * 1024 * 1024)
              except HTTPError as exc:
                  if exc.code != 302 or not logs:
                      raise OSError(f"GitHub API HTTP {exc.code}") from None
                  location = exc.headers.get("Location", "")
                  target = urlparse(location)
                  if target.scheme != "https" or not target.hostname or target.username or target.password:
                      raise ValueError("invalid log redirect") from None
              # A fresh request has no API headers. Further redirects are refused.
              return read_response(Request(location), 64 * 1024 * 1024)

          def fetch():
              instant = datetime.now(timezone.utc)
              if not TRIAL_START <= instant < TRIAL_EXPIRY:
                  errors.append("prefetch disabled outside trial window")
                  return
              if os.environ.get("FULL_SHARDS_RESULT") not in {"success", "failure"}:
                  errors.append("prefetch disabled: full shards did not finish with success or failure")
                  return
              repository = os.environ.get("GITHUB_REPOSITORY", "")
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "")
              if (not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+", repository)
                      or repository.split("/")[-1] in {".", ".."}
                      or not re.fullmatch(r"[1-9][0-9]{0,19}", run_id)
                      or not re.fullmatch(r"[1-9][0-9]{0,19}", attempt)):
                  raise ValueError("invalid repository, run ID or attempt")
              prefix = f"/repos/{repository}/actions/runs/{run_id}/attempts/{attempt}"
              raw = api_get(prefix)
              (output / "workflow-run.json").write_bytes(raw)
              json.loads(raw)
              jobs = []
              total = None
              for page in range(1, 21):
                  raw = api_get(f"{prefix}/jobs?per_page=100&page={page}")
                  (output / f"jobs-page-{page}.json").write_bytes(raw)
                  batch = json.loads(raw)
                  if (not isinstance(batch.get("jobs"), list)
                          or type(batch.get("total_count")) is not int
                          or batch["total_count"] < 0
                          or (total is not None and total != batch["total_count"])):
                      raise ValueError("invalid jobs page")
                  total = batch["total_count"]
                  jobs.extend(batch["jobs"])
                  if len(jobs) == total:
                      break
                  if not batch["jobs"] or len(jobs) > total:
                      raise ValueError("inconsistent jobs pagination")
              else:
                  raise ValueError("jobs pagination exceeded 20 pages")
              for name in SHARD_NAMES:
                  matches = [job for job in jobs if job.get("name") == name]
                  if len(matches) != 1:
                      errors.append(f"{name}: expected exactly one job")
                      continue
                  job_id = matches[0]["id"]
                  if type(job_id) is not int or job_id < 1:
                      raise ValueError("invalid job ID")
                  try:
                      raw = api_get(f"/repos/{repository}/actions/jobs/{job_id}/logs", logs=True)
                      (output / f"job-{job_id}.log").write_bytes(raw)
                  except (OSError, HTTPException, ValueError, KeyError, TypeError) as exc:
                      errors.append(f"{name}: log unavailable: {type(exc).__name__}")

          try:
              fetch()
          except (OSError, HTTPException, ValueError, KeyError, TypeError, AttributeError) as exc:
              # Exception messages and headers may contain signed URLs or tokens.
              errors.append(f"exact attempt prefetch unavailable: {type(exc).__name__}")
          (output / "fetch-errors.json").write_text(json.dumps({"errors": errors}) + "\n", encoding="utf-8")
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Check bounded trial window
        id: trial
        run: python3 scripts/pr_tier_shadow.py guard --output .pr-tier-shadow
      - uses: actions/setup-python@v7
        if: steps.trial.outputs.active == 'true' && (needs.test-shards.result == 'success' || needs.test-shards.result == 'failure')
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install shadow dependencies
        if: steps.trial.outputs.active == 'true' && (needs.test-shards.result == 'success' || needs.test-shards.result == 'failure')
        run: python -m pip install -e ".[dev,grokbot]"
      - name: Run selected files on the PR merge
        if: steps.trial.outputs.active == 'true' && (needs.test-shards.result == 'success' || needs.test-shards.result == 'failure')
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/pr_tier_shadow.py run --output .pr-tier-shadow
      - name: Compare exact attempt and write summary
        id: comparison
        if: always()
        run: |
          rejected_output=false
          if [ -L .pr-tier-shadow ]; then
            rm -- .pr-tier-shadow
            rejected_output=true
          fi
          mkdir -p .pr-tier-shadow
          rm -rf -- .pr-tier-shadow/full
          if [ -d "$RUNNER_TEMP/pr-tier-full" ]; then
            cp -R -- "$RUNNER_TEMP/pr-tier-full" .pr-tier-shadow/full
          fi
          echo 'upload_safe=true' >> "$GITHUB_OUTPUT"
          if [ "$rejected_output" = true ]; then
            echo '{"trial_status":"unknown","comparison":{"status":"incomplete","full_only_candidate_count":null,"confirmed_real_miss_count":null,"errors":["shadow output directory was a symlink"]}}' > .pr-tier-shadow/report.json
            echo 'PR test tier shadow: incomplete, rejected symlink output directory.' > .pr-tier-shadow/summary.md
            cat .pr-tier-shadow/summary.md >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          if [ -f scripts/pr_tier_shadow.py ]; then
            python3 scripts/pr_tier_shadow.py finalize --output .pr-tier-shadow --full-evidence "$RUNNER_TEMP/pr-tier-full"
          else
            mkdir -p .pr-tier-shadow
            echo '{"trial_status":"unknown","comparison":{"status":"incomplete","full_only_candidate_count":null,"confirmed_real_miss_count":null,"errors":["checkout unavailable"]}}' > .pr-tier-shadow/report.json
            echo 'PR test tier shadow: incomplete, checkout unavailable.' > .pr-tier-shadow/summary.md
            cat .pr-tier-shadow/summary.md >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
      - name: Validate shadow artifact tree
        id: artifact_safety
        if: always() && steps.comparison.outputs.upload_safe == 'true'
        run: |
          python3 -I -S - <<'PY'
          import os
          from pathlib import Path
          import stat

          try:
              root = Path(".pr-tier-shadow")
              if not stat.S_ISDIR(root.lstat().st_mode):
                  raise ValueError("artifact root is not a directory")
              pending = [root]
              while pending:
                  path = pending.pop()
                  mode = path.lstat().st_mode
                  if stat.S_ISDIR(mode):
                      with os.scandir(path) as entries:
                          pending.extend(Path(entry.path) for entry in entries)
                  elif not stat.S_ISREG(mode):
                      raise ValueError("artifact contains a link or special file")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("upload_safe=true\n")
          except (OSError, ValueError):
              print("Shadow artifact upload disabled: unsafe or unreadable evidence tree.")
              raise SystemExit(2) from None
          PY
      - name: Retain shadow evidence
        if: always() && steps.comparison.outputs.upload_safe == 'true' && steps.artifact_safety.outputs.upload_safe == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-tier-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pr-tier-shadow/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # Security-critical mesh compatibility is protected by ci-gate. Only PRs
  # with no mesh changes may skip these jobs. Pushes and merge groups run all.
  mesh-compatibility:
    needs: changes
    if: ${{ needs.changes.outputs.mesh == 'true' }}
    name: mesh (${{ matrix.os }}, ${{ matrix.crypto }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        crypto: [floor, newest]
    env:
      MESH_ENV: present
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        id: python
        with:
          python-version: "3.12"
      - name: Install mesh wheel and dev tools
        env:
          CRYPTO: ${{ matrix.crypto }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          "${{ steps.python.outputs.python-path }}" -m venv .venv
          if [ "$RUNNER_OS_NAME" = Windows ]; then
            py=.venv/Scripts
            mesh_python=.venv/Scripts/python.exe
          else
            py=.venv/bin
            mesh_python=.venv/bin/python
          fi
          "$mesh_python" -m pip install -e '.[dev,mesh]'
          if [ "$CRYPTO" = floor ]; then
            "$mesh_python" -m pip install --only-binary cryptography 'cryptography==50.0.2'
          else
            "$mesh_python" -m pip install --upgrade --only-binary cryptography 'cryptography>=50.0.2,<52'
          fi
          if [ "$RUNNER_OS_NAME" = Windows ]; then
            cygpath -w "$PWD/$py" >> "$GITHUB_PATH"
          else
            echo "$PWD/$py" >> "$GITHUB_PATH"
          fi
          echo "PY=$py" >> "$GITHUB_ENV"
          echo "MESH_PYTHON=$mesh_python" >> "$GITHUB_ENV"
      - name: Frozen profile, KATs and envelope tests
        if: runner.os == 'Linux'
        env:
          MESH_EXPORT: mesh-envelope.json
        run: brigade work verify run --target . --command './scripts/verify-focused tests/test_fleet_mesh_crypto.py' --capture brigade-work
      - name: Native frozen profile, KATs and envelope tests
        if: runner.os != 'Linux'
        run: brigade work verify run --target . --command "$MESH_PYTHON -m mypy src/brigade/fleet_mesh_crypto.py" --command "$MESH_PYTHON -m pytest -q tests/test_fleet_mesh_crypto.py" --capture brigade-work
      - name: Show verification logs
        if: always()
        run: |
          shopt -s nullglob
          logs=(.brigade/work/verify-runs/*/command-*.log)
          if (( ${#logs[@]} )); then
            cat "${logs[@]}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mesh-receipts-${{ matrix.os }}-${{ matrix.crypto }}
          path: |
            .brigade/work/verify-runs/**/receipt.json
            .brigade/work/verify-runs/**/command-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: mesh-envelope-${{ matrix.crypto }}
          path: mesh-envelope.json
          retention-days: 7

  mesh-cross-version:
    env:
      MESH_ENV: present
    name: mesh cross-version (${{ matrix.crypto }})
    needs: [changes, mesh-compatibility]
    if: ${{ needs.changes.outputs.mesh == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crypto: [floor, newest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        id: python
        with:
          python-version: "3.12"
      - name: Install
        env:
          CRYPTO: ${{ matrix.crypto }}
        run: |
          "${{ steps.python.outputs.python-path }}" -m venv .venv
          .venv/bin/python -m pip install -e '.[dev,mesh]'
          if [ "$CRYPTO" = floor ]; then
            .venv/bin/python -m pip install --only-binary cryptography 'cryptography==50.0.2'
          else
            .venv/bin/python -m pip install --upgrade --only-binary cryptography 'cryptography>=50.0.2,<52'
          fi
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mesh-envelope-${{ matrix.crypto == 'floor' && 'newest' || 'floor' }}
      - name: Open other version's envelope
        env:
          MESH_IMPORT: mesh-envelope.json
        run: brigade work verify run --target . --command './scripts/verify-focused tests/test_fleet_mesh_crypto.py::test_checked_in_envelope_and_cross_version_exchange tests/test_fleet_mesh_crypto.py::test_ci_mesh_environment' --capture brigade-work
      - name: Show verification logs
        if: always()
        run: |
          shopt -s nullglob
          logs=(.brigade/work/verify-runs/*/command-*.log)
          if (( ${#logs[@]} )); then
            cat "${logs[@]}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mesh-cross-version-receipts-${{ matrix.crypto }}
          path: |
            .brigade/work/verify-runs/**/receipt.json
            .brigade/work/verify-runs/**/command-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  mesh-without-extra:
    env:
      MESH_ENV: absent
    needs: changes
    if: ${{ needs.changes.outputs.mesh == 'true' }}
    name: mesh core without extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        id: python
        with:
          python-version: "3.12"
      - name: Install core and dev tools, remove crypto
        run: |
          "${{ steps.python.outputs.python-path }}" -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
          .venv/bin/python -m pip uninstall -y cryptography
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Plain messaging and blocked crypto CLI import
        run: brigade work verify run --target . --command './scripts/verify-focused tests/test_fleet_messages.py tests/test_fleet_messages_metadata.py tests/test_fleet_mcp.py tests/test_fleet_inbox_delivery.py tests/test_fleet_mesh_crypto.py::test_missing_extra_and_core_cli_independence tests/test_fleet_mesh_crypto.py::test_ci_mesh_environment' --capture brigade-work
      - name: Show verification logs
        if: always()
        run: |
          shopt -s nullglob
          logs=(.brigade/work/verify-runs/*/command-*.log)
          if (( ${#logs[@]} )); then
            cat "${logs[@]}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mesh-without-extra-receipts
          path: |
            .brigade/work/verify-runs/**/receipt.json
            .brigade/work/verify-runs/**/command-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
