name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
      docs_reason: ${{ steps.docs.outputs.reason }}
      code_graph: ${{ steps.docs.outputs.uncertain != 'false' && 'true' || github.event_name == 'merge_group' && 'true' || steps.filter.outputs.code_graph }}
      evidence_ledger: ${{ steps.docs.outputs.uncertain != 'false' && 'true' || github.event_name == 'merge_group' && 'true' || steps.filter.outputs.evidence_ledger }}
      notify: ${{ steps.docs.outputs.uncertain != 'false' && 'true' || github.event_name == 'merge_group' && 'true' || steps.filter.outputs.notify }}
      fleet_hub_container: ${{ steps.docs.outputs.uncertain != 'false' && 'true' || github.event_name == 'merge_group' && 'true' || steps.filter.outputs.fleet_hub_container }}
      # Fail closed: only exactly 'false' skips the hub suite. Merge groups take
      # it from the trusted selector loaded from main (hub_merge_group);
      # pull requests and pushes from the hub_filter step. docs/adaptive-ci.
      hub: ${{ steps.docs.outputs.uncertain != 'false' && 'true' || github.event_name == 'merge_group' && (steps.hub_merge_group.outputs.hub == 'false' && 'false' || 'true') || steps.hub_filter.outcome != 'success' && 'true' || steps.hub_filter.outputs.hub == 'false' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select hub suite for the merge group from trusted main
        id: hub_merge_group
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          # Load the selector and its path list from the tip of main, never
          # from the proposal. A main without the selector runs the hub suite.
          # It also reports the cumulative range start (merge base of main and
          # the head) that the docs step below classifies, and the main commit
          # it used, so both decisions rest on the same trusted inputs.
          python3 -I -S - <<'PY'
          import os
          from pathlib import Path
          import re
          import secrets
          import subprocess
          import sys
          import tempfile

          def git(*args):
              return subprocess.run(
                  ["git", "--no-replace-objects", *args], check=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=120,
              ).stdout

          def echo_inert(text):
              # Show the selector's own output with workflow commands disabled.
              token = secrets.token_hex(16)
              print(f"::stop-commands::{token}")
              print(text)
              print(f"::{token}::")

          def parse_output(text, keys):
              # Exactly one line per expected key: a missing, repeated or
              # unknown key fails, never collapses into a dict.
              pairs = [line.split("=", 1) for line in text.splitlines()]
              names = [pair[0] for pair in pairs]
              if len(pairs) != len(keys) or any(len(pair) != 2 for pair in pairs) or sorted(names) != sorted(keys):
                  raise ValueError("invalid helper output")
              return dict(pairs)

          result = {"hub": "true", "reason": "trusted-hub-selector-unavailable", "start": "", "target": ""}
          try:
              # A fixed refspec: the target never comes from the event or the proposal.
              git("fetch", "--no-tags", "--no-recurse-submodules", "--depth=1", "origin", "+refs/heads/main:refs/ci-trusted/main")
              target = git("rev-parse", "--verify", "refs/ci-trusted/main^{commit}").decode().strip()
              if not re.fullmatch(r"[0-9a-f]{40}", target):
                  raise ValueError("invalid target")
              entry = git("ls-tree", "-z", target, "--", "scripts/ci_hub_select.py")
              match = re.fullmatch(rb"100644 blob ([0-9a-f]{40})\tscripts/ci_hub_select.py\x00", entry)
              if not match:
                  raise ValueError("missing or unsafe selector")
              blob = match[1].decode("ascii")
              if not 0 < int(git("cat-file", "-s", blob)) <= 131072:
                  raise ValueError("invalid selector size")
              source = git("cat-file", "blob", blob)
              with tempfile.TemporaryDirectory(prefix="ci-hub-select-", dir=os.environ["RUNNER_TEMP"]) as directory:
                  trusted = Path(directory) / "selector.py"
                  trusted.write_bytes(source)
                  output = Path(directory) / "output"
                  try:
                      completed = subprocess.run(
                          [sys.executable, "-I", "-S", str(trusted)], check=True, timeout=300,
                          env=dict(os.environ, GITHUB_OUTPUT=str(output), CI_HUB_TARGET=target),
                          stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                      )
                  except subprocess.CalledProcessError as error:
                      echo_inert(error.stderr.decode("utf-8", "replace")[-2000:])
                      raise
                  echo_inert(completed.stdout.decode("utf-8", "replace")[-2000:])
                  candidate = parse_output(output.read_text(encoding="utf-8"), ("hub", "reason", "start"))
                  if (
                      candidate["hub"] not in {"true", "false"}
                      or not re.fullmatch(r"[a-z-]{1,80}", candidate["reason"])
                      or not re.fullmatch(r"(?:[0-9a-f]{40})?", candidate["start"])
                  ):
                      raise ValueError("invalid selector output")
                  result = dict(candidate, target=target)
          except (KeyError, TypeError, ValueError, UnicodeError, OSError, subprocess.SubprocessError):
              pass
          output = "".join(f"{key}={value}\n" for key, value in result.items())
          print(output, end="")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(output)
          PY
      - name: Classify authoritative event diff
        id: docs
        env:
          # Merge groups only: set by hub_merge_group above, empty otherwise.
          CI_TRUSTED_MAIN: ${{ steps.hub_merge_group.outputs.target }}
          CI_MERGE_GROUP_START: ${{ steps.hub_merge_group.outputs.start }}
        run: |
          # Never proposal-owned Python. Pull requests and pushes load the
          # classifier from the event's base. Merge groups load it from main's
          # tip (fetched by fixed refspec above) and classify the cumulative
          # range from the merge base with main, because merge_group.base_sha
          # is the previous queue entry's head. A source without this helper
          # deliberately takes full CI on first install.
          python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile

          def git(*args):
              return subprocess.run(
                  ["git", "--no-replace-objects", *args], check=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60,
              ).stdout

          def oid(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise ValueError("invalid object id")
              return value

          def ensure_commit(value):
              try:
                  kind = git("cat-file", "-t", value)
              except subprocess.CalledProcessError:
                  git("fetch", "--no-tags", "--no-recurse-submodules", "--depth=1", "origin", value)
                  kind = git("cat-file", "-t", value)
              if kind != b"commit\n":
                  raise ValueError("not a commit")

          def parse_output(text, keys):
              # Exactly one line per expected key: a missing, repeated or
              # unknown key fails, never collapses into a dict.
              pairs = [line.split("=", 1) for line in text.splitlines()]
              names = [pair[0] for pair in pairs]
              if len(pairs) != len(keys) or any(len(pair) != 2 for pair in pairs) or sorted(names) != sorted(keys):
                  raise ValueError("invalid helper output")
              return dict(pairs)

          result = {"docs_only": "false", "uncertain": "true", "reason": "trusted-classifier-unavailable"}
          try:
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              head = oid(os.environ["GITHUB_SHA"])
              if git("rev-parse", "HEAD").decode().strip() != head:
                  raise ValueError("checkout mismatch")
              ensure_commit(head)
              name = os.environ["GITHUB_EVENT_NAME"]
              extra = {}
              if name == "pull_request":
                  # Raw commit headers retain parents even at a shallow boundary.
                  headers = git("cat-file", "-p", head).split(b"\n\n", 1)[0].splitlines()
                  parents = [line[7:].decode("ascii") for line in headers if line.startswith(b"parent ")]
                  if len(parents) != 2 or parents[1] != oid(event["pull_request"]["head"]["sha"]):
                      raise ValueError("not the PR test merge")
                  source = oid(parents[0])
              elif name == "merge_group":
                  if oid(event["merge_group"]["head_sha"]) != head:
                      raise ValueError("merge group mismatch")
                  # The fixed-refspec main commit, which must be the one the
                  # trusted selector validated the range start against. Nothing
                  # refetches the ref between the steps, so this is a
                  # consistency check between the selector's output and the ref.
                  source = oid(git("rev-parse", "--verify", "refs/ci-trusted/main^{commit}").decode().strip())
                  if oid(os.environ["CI_TRUSTED_MAIN"]) != source:
                      raise ValueError("selector target disagrees with the trusted ref")
                  # The classifier re-checks that the start is in main's history.
                  extra = {
                      "CI_TRUSTED_MAIN": source,
                      "CI_MERGE_GROUP_START": oid(os.environ["CI_MERGE_GROUP_START"]),
                  }
              elif name == "push":
                  source = oid(event["before"])
                  if oid(event["after"]) != head:
                      raise ValueError("push mismatch")
              else:
                  raise ValueError("unsupported event")
              ensure_commit(source)
              entry = git("ls-tree", "-z", source, "--", "scripts/ci_docs_only.py")
              match = re.fullmatch(rb"100644 blob ([0-9a-f]{40})\tscripts/ci_docs_only.py\x00", entry)
              if not match:
                  raise ValueError("missing or unsafe classifier")
              blob = match[1].decode("ascii")
              if not 0 < int(git("cat-file", "-s", blob)) <= 131072:
                  raise ValueError("invalid classifier size")
              classifier = git("cat-file", "blob", blob)
              with tempfile.TemporaryDirectory(prefix="ci-classifier-", dir=os.environ["RUNNER_TEMP"]) as directory:
                  trusted = Path(directory) / "classifier.py"
                  trusted.write_bytes(classifier)
                  output = Path(directory) / "output"
                  environment = {
                      key: value for key, value in os.environ.items()
                      if key not in {"CI_TRUSTED_MAIN", "CI_MERGE_GROUP_START"}
                  }
                  subprocess.run(
                      [sys.executable, "-I", "-S", str(trusted)], check=True, timeout=300,
                      env=dict(environment, GITHUB_OUTPUT=str(output), **extra),
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  )
                  candidate = parse_output(output.read_text(encoding="utf-8"), ("docs_only", "uncertain", "reason"))
                  if (
                      candidate["docs_only"] not in {"true", "false"}
                      or candidate["uncertain"] not in {"true", "false"}
                      or (candidate["docs_only"] == "true" and candidate["uncertain"] != "false")
                      or not re.fullmatch(r"[a-z-]{1,80}", candidate["reason"])
                  ):
                      raise ValueError("invalid classifier output")
                  result = candidate
          except (KeyError, TypeError, ValueError, UnicodeError, OSError, subprocess.SubprocessError):
              pass
          output = "".join(f"{key}={value}\n" for key, value in result.items())
          print(output, end="")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(output)
          PY
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ github.event_name != 'merge_group' }}
        id: filter
        with:
          filters: |
            code_graph:
              - 'engines/code-graph/**'
              - 'src/brigade/templates/components/manifest-v1.json'
              - '.github/workflows/ci.yml'
            evidence_ledger:
              - 'engines/evidence-ledger/**'
              - 'src/brigade/templates/components/manifest-v1.json'
              - '.github/workflows/ci.yml'
            notify:
              - 'stations/notify/**'
              - 'src/brigade/templates/components/manifest-v1.json'
              - '.github/workflows/ci.yml'

            fleet_hub_container:
              - '.dockerignore'
              - 'ops/fleet-hub/**'
              - 'tests/fleet_hub_container_smoke.py'
              - '.github/workflows/ci.yml'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        # Same action and diff source as the step above. The hub path list
        # lives in one file that the merge-group selector also reads (from main).
        if: ${{ github.event_name != 'merge_group' }}
        id: hub_filter
        with:
          filters: scripts/ci_hub_paths.yml

  code-graph-msrv:
    name: MSRV (Rust 1.85)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.code_graph == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/code-graph
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/code-graph
      - name: Check locked all-features build
        run: cargo check --locked --all-features

  code-graph-build-and-test:
    name: build-and-test
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.code_graph == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/code-graph
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/code-graph
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Build (default, no-network)
        run: cargo build --release

  code-graph-feature-configurations:
    name: Feature configuration (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.code_graph == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default
            cargo_args: --no-default-features
          - name: default
            cargo_args: ""
          - name: watch-only
            cargo_args: --no-default-features --features watch
          - name: codesearch-only
            cargo_args: --no-default-features --features codesearch
          - name: miseledger-only
            cargo_args: --no-default-features --features miseledger
          - name: all-features
            cargo_args: --all-features
    defaults:
      run:
        working-directory: engines/code-graph
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/code-graph
      - name: Check locked feature configuration
        run: cargo check --locked ${{ matrix.cargo_args }}

  code-graph-windows:
    name: Windows (stable, default features)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.code_graph == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engines/code-graph
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/code-graph
      - name: Test locked default features
        run: cargo test --locked

  engine-rename-installer:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/code-graph
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: python -m pip install -e '.[dev]'
      - name: Verify native installer transitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-engine-rename-installer

  evidence-ledger-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.evidence_ledger == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/evidence-ledger
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test ./...
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - run: govulncheck ./...
      - name: Build both evidence entry points
        run: |
          for name in brigade-evidence miseledger; do
            go build -o "bin/$name" "./cmd/$name"
          done
      - run: go build -o bin/sessionfind ./cmd/sessionfind
      - run: scripts/check_release_workflow.sh
      # Each smoke runs under the canonical name and the legacy name, which
      # stays supported through v0.32.
      - name: Smoke both evidence entry points
        run: |
          for name in brigade-evidence miseledger; do
            export EVIDENCE_BIN="$PWD/bin/$name"
            scripts/smoke_archive.sh
            scripts/smoke_mcp.sh
            scripts/smoke_http.sh
          done

  notify-build-and-test:
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    name: notify-build-and-test (ubuntu-latest)
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stations/notify
    steps:
      - name: Skip notify tests (unchanged paths)
        if: ${{ needs.changes.outputs.notify != 'true' }}
        # Override job default: checkout is gated, so stations/notify is absent.
        working-directory: ${{ github.workspace }}
        run: echo "stations/notify unchanged; required check satisfied without running Go tests."
      - uses: actions/checkout@v7
        if: ${{ needs.changes.outputs.notify == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: ${{ needs.changes.outputs.notify == 'true' }}
        with:
          go-version: '1.22'
          cache-dependency-path: stations/notify/go.sum
      - name: Build
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: go build ./...
      - name: Vet
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: go vet ./...
      - name: Test
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: go test -race ./...
      - name: Test config (GOARCH=386)
        if: ${{ needs.changes.outputs.notify == 'true' }}
        env:
          GOARCH: 386
        run: go test ./internal/config/...
      - name: Setup stable Go for govulncheck
        if: ${{ needs.changes.outputs.notify == 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: stations/notify/go.sum
      - name: Install govulncheck
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Vulncheck
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: govulncheck ./...

  notify-windows:
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    name: notify-build-and-test (windows-latest)
    needs: changes
    runs-on: windows-latest
    defaults:
      run:
        working-directory: stations/notify
    steps:
      - name: Skip notify tests (unchanged paths)
        if: ${{ needs.changes.outputs.notify != 'true' }}
        # Override job default: checkout is gated, so stations/notify is absent.
        working-directory: ${{ github.workspace }}
        run: echo "stations/notify unchanged; required check satisfied without running Go tests."
      - uses: actions/checkout@v7
        if: ${{ needs.changes.outputs.notify == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: ${{ needs.changes.outputs.notify == 'true' }}
        with:
          go-version: '1.22'
          cache-dependency-path: stations/notify/go.sum
      - name: Build
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: go build ./...
      - name: Vet
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: go vet ./...
      - name: Test
        if: ${{ needs.changes.outputs.notify == 'true' }}
        run: go test -race ./...

  # Pull requests only: a merge group reports these jobs as skipped, which satisfies
  # a required check, so the queue does not wait on Windows. Selection runs once on
  # Linux and splits a large selection across up to three hosted Windows runners
  # (scripts/windows_affected_tests.py). Every selected file still runs once. The
  # 45-minute driver budget per shard covers the largest selection from the last
  # 200 main commits (257 files), which now spreads over three runners.
  windows-affected-plan:
    needs: changes
    name: windows-affected-plan
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.plan.outputs.base }}
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The test merge's two parents are all selection needs.
          fetch-depth: 2
          persist-credentials: false
      - name: Select and plan affected Windows tests
        id: plan
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # GitHub tests the pull request merged into the current base tip. Diff from
          # that merge's first parent. pull_request.base.sha can trail the base branch,
          # which would count other merged pull requests as this one's changes.
          merge_head=$(git rev-parse HEAD^2)
          if [ "$merge_head" != "$PR_HEAD_SHA" ]; then
            echo "::error::HEAD is not the pull request test merge"
            exit 1
          fi
          base=$(git rev-parse HEAD^1)
          python3 scripts/windows_affected_tests.py --base "$base" --head HEAD \
            --output "$RUNNER_TEMP/windows-affected-files.txt" --plan "$RUNNER_TEMP/windows-affected-plan.json"
          {
            echo "base=$base"
            python3 -c 'import json, sys; plan = json.load(open(sys.argv[1])); print("count=%d" % plan["count"]); print("matrix=" + json.dumps(plan["matrix"], separators=(",", ":")))' "$RUNNER_TEMP/windows-affected-plan.json"
          } >> "$GITHUB_OUTPUT"

  windows-affected-shard:
    needs: [changes, windows-affected-plan]
    name: windows-affected-shard (${{ matrix.shard }}/${{ matrix.total }})
    if: ${{ !cancelled() && needs.windows-affected-plan.result == 'success' && needs.windows-affected-plan.outputs.count != '0' && needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.windows-affected-plan.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Capture job budget
        run: |
          "WINDOWS_PYTEST_JOB_STARTED_AT=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write shard file list
        env:
          SHARD_FILES: ${{ matrix.files }}
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/windows-affected-results" | Out-Null
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/windows-affected-results/files.txt", $env:SHARD_FILES, [Text.UTF8Encoding]::new($false))
          Write-Output "shard ${{ matrix.shard }}/${{ matrix.total }}: $(@(Get-Content "$env:RUNNER_TEMP/windows-affected-results/files.txt").Count) files"
      - name: Set up supported Node for npm launcher tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.15.0"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[dev,connector]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure Windows test temp drive
        run: python scripts/windows_pytest.py --configure-temp-root
      - name: Probe SQLite flush latency
        timeout-minutes: 5
        run: python scripts/windows_sqlite_flush_probe.py --samples 20 --output "$env:RUNNER_TEMP/windows-affected-results/sqlite-flush.json"
      - name: Run affected Windows tests
        timeout-minutes: 45
        env:
          BASE_SHA: ${{ needs.windows-affected-plan.outputs.base }}
        run: >-
          python scripts/windows_pytest.py
          --files-from "$env:RUNNER_TEMP/windows-affected-results/files.txt"
          --keep-order
          --record "$env:RUNNER_TEMP/windows-affected-results/summary.json"
          --base-ref $env:BASE_SHA
          --job-started-at $env:WINDOWS_PYTEST_JOB_STARTED_AT
          --job-limit 2700 --startup-reserve 120 --finalize-reserve 300
          --job-timeout 2280 --serial test_runs_serve.py --serial test_aboyeur.py
      - name: Upload affected Windows results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-affected-results-${{ matrix.shard }}of${{ matrix.total }}
          path: ${{ runner.temp }}/windows-affected-results
          if-no-files-found: warn
          retention-days: 7

  # Stable check name for the Windows shards. Do not make it a required status on
  # its own: like every job here it uses !cancelled(), so a cancelled run skips it,
  # and GitHub counts a skipped required check as passing. Gate through ci-gate.
  windows-affected-tests:
    needs: [changes, windows-affected-plan, windows-affected-shard]
    name: windows-affected-tests
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Windows shard
        env:
          PLAN_RESULT: ${{ needs.windows-affected-plan.result }}
          PLAN_COUNT: ${{ needs.windows-affected-plan.outputs.count }}
          SHARD_RESULT: ${{ needs.windows-affected-shard.result }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::windows-affected-plan: $PLAN_RESULT"
            exit 1
          fi
          if [ "$PLAN_COUNT" = 0 ]; then
            if [ "$SHARD_RESULT" != skipped ]; then
              echo "::error::windows-affected-shard ran for an empty selection: $SHARD_RESULT"
              exit 1
            fi
            echo "No affected Windows tests."
            exit 0
          fi
          if [ "$SHARD_RESULT" != success ]; then
            echo "::error::windows-affected-shard: $SHARD_RESULT"
            exit 1
          fi

  lint:
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The allowlist ratchet reads the test merge's first parent on pull requests.
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff check
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy
      - name: Size ratchet baseline
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.base_ref || 'main' }}
          python scripts/check_size_ratchet_baseline.py --base-ref origin/${{ github.base_ref || 'main' }}
      - name: Resolve allowlist base
        id: allowlist-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Compare with the base tip GitHub merged into. pull_request.base.sha can
            # trail main and would blame this pull request for allowlist growth on main.
            if [ "$(git rev-parse HEAD^2 2>/dev/null)" != "$PR_HEAD_SHA" ]; then
              echo "::error::HEAD is not the pull request test merge"
              exit 1
            fi
            base=$(git rev-parse HEAD^1)
          else
            base=$EVENT_BASE_SHA
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Windows allowlist ratchet
        env:
          BASE_SHA: ${{ steps.allowlist-base.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "::error::Windows allowlist base SHA is missing"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python scripts/windows_pytest.py --check-allowlist-only --base-ref "$BASE_SHA"
      - name: Version sync
        run: python scripts/version_sync.py --check
      - name: Managed snapshot
        run: python scripts/managed_snapshot.py --check
      - name: Template profile snapshot
        run: python scripts/template_profile_snapshot.py --check

  test-shards:
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    needs: changes
    name: test shard (${{ matrix.python }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the Python 3.12 shards, which also carry coverage.
        # Merge groups and pushes to main run every supported Python, so 3.11
        # runs on the combined change in the queue (and again on the
        # push to main) rather than on every pull request push.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.11", "3.12"]') }}
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Set up supported Node for npm launcher tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.15.0"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        if: matrix.python != '3.12'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install with connector extra
        if: matrix.python == '3.12'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,connector]"
      - name: Pytest shard
        if: matrix.python != '3.12'
        run: python scripts/ci_pytest_shard.py --shard-index "${{ matrix.shard }}" --shard-count 4 -- -q -n 4 --dist=worksteal
      - name: Pytest shard with coverage
        if: matrix.python == '3.12'
        env:
          COVERAGE_CORE: sysmon
          COVERAGE_FILE: .coverage.${{ matrix.python }}.${{ matrix.shard }}
          # Shadow test selection records per-test results on pull requests only.
          # An argument, not PYTEST_ADDOPTS, so tests that spawn pytest cannot overwrite it.
          SHADOW_JUNIT: ${{ github.event_name == 'pull_request' && format('--junitxml=shadow-junit-{0}.xml -o junit_family=xunit1', matrix.shard) || '' }}
        run: python scripts/ci_pytest_shard.py --shard-index "${{ matrix.shard }}" --shard-count 4 -- -q -n 4 --dist=worksteal $SHADOW_JUNIT --cov="$PWD/src/brigade" --cov-report=
      - name: Assert connector MCP tests run without skips
        if: matrix.python == '3.12' && matrix.shard == 0
        run: |
          output=$(python -m pytest tests/test_cloud_agent_profile.py tests/test_dot_transport.py -q --no-header -p no:cacheprovider 2>&1)
          pytest_exit=$?
          echo "$output"
          if [ $pytest_exit -ne 0 ]; then
            echo "ERROR: connector MCP tests failed"
            exit 1
          fi
          if grep -q 'skipped' <<< "$output"; then
            echo "ERROR: connector MCP tests were skipped; install the connector extra"
            exit 1
          fi
      - name: Upload coverage data
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python }}-${{ matrix.shard }}
          path: .coverage.${{ matrix.python }}.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload shadow junit
        if: ${{ !cancelled() && github.event_name == 'pull_request' && matrix.python == '3.12' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shadow-junit-${{ matrix.shard }}
          path: shadow-junit-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  # Shadow test selection (docs/adaptive-ci/shadow-selection.md). These two jobs observe
  # what a selective run would skip and record any failing test it would have missed.
  # Every test still runs. Neither job is in ci-gate's needs, both are non-blocking, and
  # pushes and merge groups never run them.
  shadow-plan:
    name: shadow test selection plan
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Compute shadow plan
        # HEAD^1 is the base tip GitHub merged into, so the diff is the pull request's own change.
        run: python3 scripts/ci_test_selection.py --base HEAD^1 --head HEAD --output shadow-plan/shadow-plan.json
      - name: Upload shadow plan
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shadow-plan
          path: shadow-plan/shadow-plan.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  shadow-selection:
    name: shadow test selection report
    needs: [changes, shadow-plan, test-shards]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download shadow plan
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: shadow-plan
          path: shadow-in/plan
      - name: Download shard junit
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: shadow-junit-*
          path: shadow-in/junit
          merge-multiple: true
      - name: Join plan and shard results
        env:
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: |
          # The report records its own errors in the artifact. If the script itself
          # cannot run, write an error report instead of failing quietly.
          python3 scripts/ci_shadow_report.py --plan shadow-in/plan/shadow-plan.json --junit-dir shadow-in/junit --output shadow-out/shadow-selection.json || {
            echo "::warning::shadow report script exited nonzero"
            mkdir -p shadow-out
            echo '{"schema_version":1,"status":"error","errors":["report script exited nonzero"],"mode":"unknown","policies":{},"failing_files":[],"test_files_total":0}' > shadow-out/shadow-selection.json
          }
      - name: Upload shadow selection
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shadow-selection
          path: shadow-out/shadow-selection.json
          if-no-files-found: warn
          overwrite: true

  fleet-hub-container:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.fleet_hub_container == 'true' }}
    name: Fleet Hub container (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and exercise the container image
        run: python tests/fleet_hub_container_smoke.py --platform "${{ matrix.platform }}"

  hub-rust:
    # Rust hub suite (stable and MSRV 1.85.0) lives in hub.yml. Calling it here
    # puts it under ci-gate and the merge queue.
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.hub == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/hub.yml

  coverage:
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.test-shards.result == 'success' }}
    needs: [changes, test-shards]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download coverage data
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-*
          path: .coverage-data
          merge-multiple: true
      - name: Combine coverage
        run: python -m coverage combine .coverage-data
      - name: Coverage report
        run: python -m coverage report --fail-under=78

  test:
    name: test (${{ matrix.python }})
    needs: [changes, test-shards, coverage, cosign-integration, fleet-hub-container]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Note Python shards deferred to the merge queue
        if: ${{ github.event_name == 'pull_request' && matrix.python != '3.12' }}
        run: echo "::notice::Python ${{ matrix.python }} shards run in the merge queue, not on pull requests."
      - name: Require shards, coverage, and cosign integration
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHARDS_RESULT: ${{ needs.test-shards.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          COSIGN_RESULT: ${{ needs.cosign-integration.result }}
          FLEET_HUB_RESULT: ${{ needs.fleet-hub-container.result }}
          FLEET_HUB_REQUIRED: ${{ needs.changes.outputs.fleet_hub_container == 'true' }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "changes=$CHANGES_RESULT"
            exit 1
          fi
          if [ "$SHARDS_RESULT" != "success" ] || [ "$COVERAGE_RESULT" != "success" ] || [ "$COSIGN_RESULT" != "success" ]; then
            echo "test-shards=$SHARDS_RESULT coverage=$COVERAGE_RESULT cosign-integration=$COSIGN_RESULT fleet-hub-container=$FLEET_HUB_RESULT"
            exit 1
          fi
          if [ "$FLEET_HUB_RESULT" != "success" ]; then
            if [ "$FLEET_HUB_RESULT" != "skipped" ] || [ "$FLEET_HUB_REQUIRED" != "false" ]; then
              echo "fleet-hub-container=$FLEET_HUB_RESULT required=$FLEET_HUB_REQUIRED"
              exit 1
            fi
          fi

  # Required aggregate: ci-gate is the only required status check on main.
  # It replaced the 20 per-job contexts after the GitHub deliberate-failure
  # checks in docs/runbooks/ci-runner-pilot.md passed. Keep its needs list
  # equal to the policy set below; a mismatch fails closed.
  ci-gate:
    if: ${{ !cancelled() }}
    needs:
      - changes
      - lint
      - test
      - test-shards
      - coverage
      - cosign-integration
      - fleet-hub-container
      - hub-rust
      - component-manifest-provenance
      - engine-rename-installer
      - content-guard
      - repo-metadata
      - changelog-fragments
      - install-from-source
      - quickstart-smoke
      - windows-native-acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Require all protected jobs and their dependencies
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os

          # Full CI retains the existing exact native exceptions. Confirmed
          # documentation-only runs may skip only the enumerated runtime jobs.
          mandatory = {
              "changes", "lint", "test", "test-shards", "coverage",
              "cosign-integration", "fleet-hub-container", "hub-rust", "component-manifest-provenance", "engine-rename-installer",
              "content-guard", "repo-metadata", "changelog-fragments", "install-from-source",
              "quickstart-smoke", "windows-native-acceptance",
          }
          needs = json.loads(os.environ["NEEDS_JSON"])
          errors = []
          if set(needs) != mandatory:
              errors.append(
                  f"DAG mismatch: missing={mandatory - set(needs)}, "
                  f"extra={set(needs) - mandatory}"
              )
          changes = needs.get("changes", {})
          docs_flag = changes.get("outputs", {}).get("docs_only")
          if docs_flag not in {"true", "false"}:
              errors.append("changes: required success, got missing/invalid docs classification")
          docs_only = changes.get("result") == "success" and docs_flag == "true"
          docs_skips = {
              "lint", "test", "test-shards", "coverage", "cosign-integration",
              "fleet-hub-container", "hub-rust", "component-manifest-provenance", "engine-rename-installer", "install-from-source",
              "quickstart-smoke", "windows-native-acceptance",
          }
          container_skip_allowed = (
              changes.get("result") == "success"
              and changes.get("outputs", {}).get("fleet_hub_container") == "false"
              and os.environ["EVENT_NAME"] != "merge_group"
          )
          # `hub` is exactly 'false' only when its selector proved no hub path
          # changed: in a merge group the trusted selector from main over the
          # merge base with main, so the same rule applies on every event.
          hub_skip_allowed = (
              changes.get("result") == "success"
              and changes.get("outputs", {}).get("hub") == "false"
          )
          for name in sorted(mandatory):
              result = needs.get(name, {}).get("result")
              if docs_only and name in docs_skips and result == "skipped":
                  continue
              if name == "fleet-hub-container" and result == "skipped" and container_skip_allowed:
                  continue
              if name == "hub-rust" and result == "skipped" and hub_skip_allowed:
                  continue
              if result != "success":
                  errors.append(f"{name}: required success, got {result!r}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("All protected CI jobs and dependencies satisfied the shadow policy")
          PY

  component-manifest-provenance:
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Exercise generated-release provenance contract
        run: python -m pytest tests/test_component_manifest_provenance.py -q

  cosign-integration:
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    needs: changes
    name: cosign (${{ matrix.cosign }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cosign: ["v2.6.5", "v3.1.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ matrix.cosign }}
      - name: Display cosign version
        run: cosign version
      - name: Exercise real cosign bundle verification
        run: |
          set +e
          output=$(python -m pytest tests/test_cosign_attestation.py::test_real_cosign_bundle_verifies_with_git_tree_subject -q --no-header -p no:cacheprovider 2>&1)
          pytest_exit=$?
          set -e
          echo "$output"
          if [ $pytest_exit -ne 0 ]; then
            echo "ERROR: real cosign integration test failed"
            exit 1
          fi
          if ! grep -q '1 passed' <<< "$output"; then
            echo "ERROR: real cosign integration test did not pass"
            exit 1
          fi

  content-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Scans with the guard this repo ships, not a pinned copy of the retired
      # standalone repo. Brigade has no runtime dependencies, so PYTHONPATH is
      # enough and no install step is needed. --baseline accepts the findings
      # recorded in .content-guard-baseline.json (synthetic fixtures, example
      # hosts) so the gate fails on NEW leakage only.
      - name: Scan
        run: |
          PYTHONPATH=src python -m brigade.guard audit . \
            --scope tracked \
            --strict \
            --baseline .content-guard-baseline.json

  repo-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Command Inventory
        run: |
          set +e
          brigade roadmap commands --check
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error file=docs/command-inventory.md::docs/command-inventory.md is stale; regenerate with BRIGADE_EXTRAS=1 brigade roadmap commands --write"
          fi
          exit "$status"
        env:
          BRIGADE_EXTRAS: "1"
      - name: Roadmap Version
        run: |
          if [ ! -f ROADMAP.md ]; then
            echo "::error file=ROADMAP.md::ROADMAP.md is missing; this repo must ship a roadmap with a **vX.Y.x on main** headline"
            exit 1
          fi
          set +e
          brigade roadmap audit --check
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error file=ROADMAP.md::ROADMAP.md version headline is stale or unparseable; update the Where things stand headline to **vX.Y.x on main** matching pyproject.toml major.minor"
          fi
          exit "$status"
        env:
          BRIGADE_EXTRAS: "1"
      - name: Template Audit
        run: brigade security template-audit --target . --json

  changelog-fragments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      # Runs on docs-only diffs too: a CHANGELOG.md edit alone classifies as
      # documentation, and it is exactly what the guard below rejects.
      - name: Validate changelog fragments
        run: python3 scripts/changelog_fragments.py check
      - name: Reject CHANGELOG.md edits outside a release commit
        if: ${{ github.event_name != 'push' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Compare with the base tip GitHub merged into, as the lint job does.
            if [ "$(git rev-parse HEAD^2 2>/dev/null)" != "$PR_HEAD_SHA" ]; then
              echo "::error::HEAD is not the pull request test merge"
              exit 1
            fi
            base=$(git rev-parse HEAD^1)
          else
            base=$EVENT_BASE_SHA
            if [ -z "$base" ]; then
              echo "::error::merge group base SHA is missing"
              exit 1
            fi
            git fetch --no-tags --depth=1 origin "$base"
          fi
          python3 scripts/changelog_fragments.py guard --base "$base"

  install-from-source:
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        combo:
          - name: "repo+claude"
            flags: "--depth repo --harnesses claude"
          - name: "repo+codex"
            flags: "--depth repo --harnesses codex"
          - name: "workspace+claude+openclaw"
            flags: "--depth workspace --harnesses claude,openclaw"
          - name: "workspace+codex+openclaw"
            flags: "--depth workspace --harnesses codex,openclaw"
          - name: "workspace+hermes"
            flags: "--depth workspace --harnesses hermes"
          - name: "kitchen-sink"
            flags: "--depth workspace --harnesses claude,codex,openclaw,hermes"
          - name: "workspace+none"
            flags: "--depth workspace --harnesses none"
          - name: "repo+claude+publisher"
            flags: "--depth repo --harnesses claude --include publisher"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pipx install
        run: |
          python -m pip install --upgrade pip pipx
          pipx install .
          brigade --version
      - name: Init + doctor
        run: |
          target="$(mktemp -d)"
          git init -q -b main "$target"
          brigade init --target "$target" ${{ matrix.combo.flags }}
          brigade doctor --target "$target"
          case "${{ matrix.combo.flags }}" in
            *hermes*)
              test -f "$target/.hermes/memory-handoffs/TEMPLATE.md"
              test -d "$target/.hermes/memory-handoffs/processed"
              test -f "$target/.brigade/hermes/workspace.harness.json"
              test -f "$target/.brigade/hermes/memory-handoff.harness.json"
              grep -q '"handoff_inbox": ".hermes/memory-handoffs"' "$target/.brigade/hermes/workspace.harness.json"
              grep -q '"inbox_dir": ".hermes/memory-handoffs"' "$target/.brigade/hermes/memory-handoff.harness.json"
              ! grep -R '.claude/memory-handoffs' "$target/.brigade/hermes"
              brigade handoff sources init --target "$target" --force
              brigade handoff draft --target "$target" --inbox hermes \
                --title "Hermes CI smoke" \
                --summary "Hermes can write a local Brigade handoff." \
                --content "### Hermes CI smoke

          The Hermes inbox follows the shared Brigade handoff contract."
              brigade operator verify-harness --harness hermes --target "$target"
              ;;
          esac

  quickstart-smoke:
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    needs: changes
    name: quickstart-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pipx install
        run: |
          python -m pip install --upgrade pip pipx
          pipx install .
          brigade --version
      - name: Quickstart (minimal default, Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          target="$(mktemp -d)"
          git init -q -b main "$target"
          brigade operator quickstart --target "$target" --harnesses codex --json
          brigade operator doctor --target "$target" --profile local-operator --json
          test -f "$target/.brigade/config.json"
          test -d "$target/.codex/memory-handoffs"
          test -f "$target/.codex/skills/brigade-work/SKILL.md"
          test -f "$target/AGENTS.md"
          test ! -e "$target/tools"
          test ! -e "$target/rules"
          test ! -e "$target/INSTALL_FOR_AGENTS.md"
      - name: Quickstart (minimal default, PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "brigade-quickstart-minimal"
          git init -q -b main $target
          brigade operator quickstart --target $target --harnesses codex --json
          brigade operator doctor --target $target --profile local-operator --json
          if (-not (Test-Path (Join-Path $target ".brigade/config.json"))) { throw "missing Brigade config" }
          if (-not (Test-Path (Join-Path $target ".codex/memory-handoffs"))) { throw "missing Codex handoff inbox" }
          if (-not (Test-Path (Join-Path $target ".codex/skills/brigade-work/SKILL.md"))) { throw "missing brigade-work skill" }
          if (-not (Test-Path (Join-Path $target "AGENTS.md"))) { throw "missing AGENTS.md" }
          if (Test-Path (Join-Path $target "tools")) { throw "minimal install unexpectedly created tools" }
          if (Test-Path (Join-Path $target "rules")) { throw "minimal install unexpectedly created rules" }
          if (Test-Path (Join-Path $target "INSTALL_FOR_AGENTS.md")) { throw "minimal install unexpectedly created full-kit guide" }
      - name: Quickstart (--full, Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          target="$(mktemp -d)"
          git init -q -b main "$target"
          brigade operator quickstart --target "$target" --harnesses codex --full --json
          brigade operator doctor --target "$target" --profile local-operator --json
          test -f "$target/.codex/skills/frontend/SKILL.md"
          test -f "$target/tools/antislop.md"
          test -f "$target/INSTALL_FOR_AGENTS.md"
          test -f "$target/rules/issue-tdd-loop.md"
      - name: Quickstart (--full, PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "brigade-quickstart-full"
          git init -q -b main $target
          brigade operator quickstart --target $target --harnesses codex --full --json
          brigade operator doctor --target $target --profile local-operator --json
          if (-not (Test-Path (Join-Path $target ".codex/skills/frontend/SKILL.md"))) { throw "missing frontend skill" }
          if (-not (Test-Path (Join-Path $target "tools/antislop.md"))) { throw "missing antislop tool" }
          if (-not (Test-Path (Join-Path $target "INSTALL_FOR_AGENTS.md"))) { throw "missing full-kit guide" }
          if (-not (Test-Path (Join-Path $target "rules/issue-tdd-loop.md"))) { throw "missing issue/TDD rule" }

  # Optional capacity probe. Existing protected checks remain hosted.
  trusted-runner-canary:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.BRIGADE_SELF_HOSTED == 'on' }}
    runs-on:
      group: brigade-trusted
      labels: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Smoke source CLI in a temporary workspace
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python3 -m brigade --version
          target="$(mktemp -d)"
          trap 'rm -rf "$target"' EXIT
          git init -q -b main "$target"
          python3 -m brigade init --target "$target" --depth workspace --harnesses claude,codex
          python3 -m brigade doctor --target "$target"

  windows-native-acceptance:
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    needs: changes
    name: windows-native-acceptance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Configure Windows test temp drive
        shell: pwsh
        run: python scripts/windows_pytest.py --configure-temp-root
      - name: Probe SQLite flush latency
        shell: pwsh
        timeout-minutes: 5
        run: python scripts/windows_sqlite_flush_probe.py --samples 20 --output "$env:RUNNER_TEMP/windows-native-sqlite-flush.json"
      - name: Upload SQLite flush diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-sqlite-flush
          path: ${{ runner.temp }}/windows-native-sqlite-flush.json
          if-no-files-found: warn
          retention-days: 7
      - name: Install containment test dependencies
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "containment-venv"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "containment venv creation failed" }
          $python = Join-Path $venv "Scripts/python.exe"
          & $python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "containment test install failed" }
      - name: Run native Windows process containment
        shell: pwsh
        run: |
          $python = Join-Path $env:RUNNER_TEMP "containment-venv/Scripts/python.exe"
          @'
          import os
          import sys
          import pytest
          assert os.name == "nt", "native Windows runner required"
          class NoNativeSkips:
              skipped = False
              def pytest_runtest_logreport(self, report):
                  self.skipped |= report.skipped
              def pytest_collectreport(self, report):
                  self.skipped |= report.skipped
          guard = NoNativeSkips()
          result = pytest.main(["-q", "-ra", "-o", "addopts=", "tests/test_windows_job.py::TestNativeContainment", "tests/test_skills_state_windows.py", "tests/test_claude_hooks_state_containment.py", "tests/test_dirfd.py::test_fsync_directory_accepts_native_windows_directory_handles", "tests/test_fleet_claim_loss_cancellation.py::test_native_windows_claim_loss_stops_silent_worker", "tests/test_nt_private_storage.py::TestNativePrivateStorage"], plugins=[guard])
          sys.exit(1 if guard.skipped else int(result))
          '@ | & $python -
          if ($LASTEXITCODE -ne 0) { throw "native containment failed or skipped" }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/code-graph
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build same-commit native engines
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path engine-bin | Out-Null
          Push-Location engines/code-graph
          $codeGraphBins = @("graphtrail", "graphtrail-mcp", "brigade-code-graph", "brigade-code-graph-mcp")
          cargo build --release --locked @($codeGraphBins | ForEach-Object { "--bin"; $_ })
          if ($LASTEXITCODE -ne 0) { throw "code graph build failed" }
          foreach ($bin in $codeGraphBins) {
            Copy-Item "target/release/$bin.exe" "$env:GITHUB_WORKSPACE/engine-bin/$bin.exe"
          }
          Pop-Location
          Push-Location engines/evidence-ledger
          $env:CGO_ENABLED = "0"
          go build -trimpath -o "$env:GITHUB_WORKSPACE/engine-bin/miseledger.exe" ./cmd/miseledger
          if ($LASTEXITCODE -ne 0) { throw "miseledger build failed" }
          go build -trimpath -o "$env:GITHUB_WORKSPACE/engine-bin/sessionfind.exe" ./cmd/sessionfind
          if ($LASTEXITCODE -ne 0) { throw "sessionfind build failed" }
          go build -trimpath -o "$env:GITHUB_WORKSPACE/engine-bin/brigade-evidence.exe" ./cmd/brigade-evidence
          if ($LASTEXITCODE -ne 0) { throw "brigade-evidence build failed" }
          Pop-Location
      - name: Canonical and legacy evidence executable compatibility
        shell: pwsh
        run: |
          go -C engines/evidence-ledger test ./cmd/miseledger -run '^TestEvidenceExecutableCompatibility$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw "evidence executable compatibility failed" }
      - name: Run Windows native acceptance (source install)
        shell: powershell
        run: |
          & "${{ github.workspace }}\scripts\windows-native-acceptance.ps1" -InstallMode source -RepoRoot "${{ github.workspace }}" -EngineBinDir "${{ github.workspace }}\engine-bin"
      - name: Native two-process journal lock regressions
        shell: pwsh
        run: |
          foreach ($key in @("CURSOR_API_KEY", "CURSOR_CLOUD_API_KEY", "BG_AGENT_API_KEY")) {
            Remove-Item "Env:$key" -ErrorAction SilentlyContinue
          }
          $venv = Join-Path $env:RUNNER_TEMP "journal-lock-venv"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "journal lock venv creation failed" }
          $python = Join-Path $venv "Scripts/python.exe"
          & $python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "journal lock dev install failed" }
          & $python -m pytest -q tests/test_run_journal.py::test_windows_journal_lock_excludes_unbound_mutation_during_bound_tail_window
          if ($LASTEXITCODE -ne 0) { throw "native journal lock regressions failed" }

  pr-tier-shadow:
    name: PR test tiers (shadow observation)
    needs: [changes, test-shards]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request' && github.repository != '' && github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - name: Prefetch full evidence before PR code
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: |
          python3 -I -S - <<'PY'
          from datetime import datetime, timezone
          from http.client import HTTPException
          import json
          import os
          from pathlib import Path
          import re
          import time
          from urllib.error import HTTPError
          from urllib.parse import urlparse
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          TRIAL_START = datetime(2026, 10, 23, tzinfo=timezone.utc)
          TRIAL_EXPIRY = datetime(2026, 11, 6, tzinfo=timezone.utc)
          SHARD_NAMES = [f"test shard (3.12, {index})" for index in range(4)]
          output = Path(os.environ["RUNNER_TEMP"]) / "pr-tier-full"
          output.mkdir(parents=True, exist_ok=True)
          errors = []
          deadline = time.monotonic() + 240

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = build_opener(NoRedirect())

          def read_response(request, limit):
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise TimeoutError("prefetch deadline exceeded")
              with opener.open(request, timeout=min(30, remaining)) as response:
                  chunks = []
                  size = 0
                  while True:
                      if time.monotonic() >= deadline:
                          raise TimeoutError("prefetch deadline exceeded")
                      chunk = response.read(min(65536, limit + 1 - size))
                      if not chunk:
                          return b"".join(chunks)
                      chunks.append(chunk)
                      size += len(chunk)
                      if size > limit:
                          raise ValueError("response size exceeded")

          def api_get(path, *, logs=False):
              request = Request("https://api.github.com" + path, headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              })
              try:
                  return read_response(request, 64 * 1024 * 1024 if logs else 4 * 1024 * 1024)
              except HTTPError as exc:
                  if exc.code != 302 or not logs:
                      raise OSError(f"GitHub API HTTP {exc.code}") from None
                  location = exc.headers.get("Location", "")
                  target = urlparse(location)
                  if target.scheme != "https" or not target.hostname or target.username or target.password:
                      raise ValueError("invalid log redirect") from None
              # A fresh request has no API headers. Further redirects are refused.
              return read_response(Request(location), 64 * 1024 * 1024)

          def fetch():
              instant = datetime.now(timezone.utc)
              if not TRIAL_START <= instant < TRIAL_EXPIRY:
                  errors.append("prefetch disabled outside trial window")
                  return
              if os.environ.get("FULL_SHARDS_RESULT") not in {"success", "failure"}:
                  errors.append("prefetch disabled: full shards did not finish with success or failure")
                  return
              repository = os.environ.get("GITHUB_REPOSITORY", "")
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "")
              if (not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+", repository)
                      or repository.split("/")[-1] in {".", ".."}
                      or not re.fullmatch(r"[1-9][0-9]{0,19}", run_id)
                      or not re.fullmatch(r"[1-9][0-9]{0,19}", attempt)):
                  raise ValueError("invalid repository, run ID or attempt")
              prefix = f"/repos/{repository}/actions/runs/{run_id}/attempts/{attempt}"
              raw = api_get(prefix)
              (output / "workflow-run.json").write_bytes(raw)
              json.loads(raw)
              jobs = []
              total = None
              for page in range(1, 21):
                  raw = api_get(f"{prefix}/jobs?per_page=100&page={page}")
                  (output / f"jobs-page-{page}.json").write_bytes(raw)
                  batch = json.loads(raw)
                  if (not isinstance(batch.get("jobs"), list)
                          or type(batch.get("total_count")) is not int
                          or batch["total_count"] < 0
                          or (total is not None and total != batch["total_count"])):
                      raise ValueError("invalid jobs page")
                  total = batch["total_count"]
                  jobs.extend(batch["jobs"])
                  if len(jobs) == total:
                      break
                  if not batch["jobs"] or len(jobs) > total:
                      raise ValueError("inconsistent jobs pagination")
              else:
                  raise ValueError("jobs pagination exceeded 20 pages")
              for name in SHARD_NAMES:
                  matches = [job for job in jobs if job.get("name") == name]
                  if len(matches) != 1:
                      errors.append(f"{name}: expected exactly one job")
                      continue
                  job_id = matches[0]["id"]
                  if type(job_id) is not int or job_id < 1:
                      raise ValueError("invalid job ID")
                  try:
                      raw = api_get(f"/repos/{repository}/actions/jobs/{job_id}/logs", logs=True)
                      (output / f"job-{job_id}.log").write_bytes(raw)
                  except (OSError, HTTPException, ValueError, KeyError, TypeError) as exc:
                      errors.append(f"{name}: log unavailable: {type(exc).__name__}")

          try:
              fetch()
          except (OSError, HTTPException, ValueError, KeyError, TypeError, AttributeError) as exc:
              # Exception messages and headers may contain signed URLs or tokens.
              errors.append(f"exact attempt prefetch unavailable: {type(exc).__name__}")
          (output / "fetch-errors.json").write_text(json.dumps({"errors": errors}) + "\n", encoding="utf-8")
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Check bounded trial window
        id: trial
        run: python3 scripts/pr_tier_shadow.py guard --output .pr-tier-shadow
      - uses: actions/setup-python@v7
        if: steps.trial.outputs.active == 'true' && (needs.test-shards.result == 'success' || needs.test-shards.result == 'failure')
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install shadow dependencies
        if: steps.trial.outputs.active == 'true' && (needs.test-shards.result == 'success' || needs.test-shards.result == 'failure')
        run: python -m pip install -e ".[dev,connector]"
      - name: Run selected files on the PR merge
        if: steps.trial.outputs.active == 'true' && (needs.test-shards.result == 'success' || needs.test-shards.result == 'failure')
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/pr_tier_shadow.py run --output .pr-tier-shadow
      - name: Compare exact attempt and write summary
        id: comparison
        if: always()
        run: |
          rejected_output=false
          if [ -L .pr-tier-shadow ]; then
            rm -- .pr-tier-shadow
            rejected_output=true
          fi
          mkdir -p .pr-tier-shadow
          rm -rf -- .pr-tier-shadow/full
          if [ -d "$RUNNER_TEMP/pr-tier-full" ]; then
            cp -R -- "$RUNNER_TEMP/pr-tier-full" .pr-tier-shadow/full
          fi
          echo 'upload_safe=true' >> "$GITHUB_OUTPUT"
          if [ "$rejected_output" = true ]; then
            echo '{"trial_status":"unknown","comparison":{"status":"incomplete","full_only_candidate_count":null,"confirmed_real_miss_count":null,"errors":["shadow output directory was a symlink"]}}' > .pr-tier-shadow/report.json
            echo 'PR test tier shadow: incomplete, rejected symlink output directory.' > .pr-tier-shadow/summary.md
            cat .pr-tier-shadow/summary.md >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          if [ -f scripts/pr_tier_shadow.py ]; then
            python3 scripts/pr_tier_shadow.py finalize --output .pr-tier-shadow --full-evidence "$RUNNER_TEMP/pr-tier-full"
          else
            mkdir -p .pr-tier-shadow
            echo '{"trial_status":"unknown","comparison":{"status":"incomplete","full_only_candidate_count":null,"confirmed_real_miss_count":null,"errors":["checkout unavailable"]}}' > .pr-tier-shadow/report.json
            echo 'PR test tier shadow: incomplete, checkout unavailable.' > .pr-tier-shadow/summary.md
            cat .pr-tier-shadow/summary.md >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
      - name: Validate shadow artifact tree
        id: artifact_safety
        if: always() && steps.comparison.outputs.upload_safe == 'true'
        run: |
          python3 -I -S - <<'PY'
          import os
          from pathlib import Path
          import stat

          try:
              root = Path(".pr-tier-shadow")
              if not stat.S_ISDIR(root.lstat().st_mode):
                  raise ValueError("artifact root is not a directory")
              pending = [root]
              while pending:
                  path = pending.pop()
                  mode = path.lstat().st_mode
                  if stat.S_ISDIR(mode):
                      with os.scandir(path) as entries:
                          pending.extend(Path(entry.path) for entry in entries)
                  elif not stat.S_ISREG(mode):
                      raise ValueError("artifact contains a link or special file")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("upload_safe=true\n")
          except (OSError, ValueError):
              print("Shadow artifact upload disabled: unsafe or unreadable evidence tree.")
              raise SystemExit(2) from None
          PY
      - name: Retain shadow evidence
        if: always() && steps.comparison.outputs.upload_safe == 'true' && steps.artifact_safety.outputs.upload_safe == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-tier-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pr-tier-shadow/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
