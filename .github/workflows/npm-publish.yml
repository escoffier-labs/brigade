name: Stable npm publication

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed npm promotion commit on main
        required: true
        type: string
      release_tag:
        description: Qualified Python release tag
        required: true
        default: v0.31.0
        type: string

permissions:
  contents: read

concurrency:
  group: stable-npm-publication-0.31.0
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require exact main dispatch and stable release tag
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$RELEASE_TAG" = v0.31.0
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = 4edc8911775f3f693bf9421812806a859b837d6e
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
      - name: Pin npm archive and provenance toolchain
        run: |
          npm install --global npm@11.19.1 --ignore-scripts
          test "$(node --version)" = v24.22.0
          test "$(npm --version)" = 11.19.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Verify real source provenance cryptography
        shell: bash
        run: >-
          PYTHONPATH=src python -m brigade work verify run --target .
          --argv-json '["node","--test","npm/feasibility/provenance.test.cjs"]'
          --timeout 300 --capture brigade-work
      - name: Build six stable payload archives once from clean source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          argv=$(node -e 'process.stdout.write(JSON.stringify(["python","npm/feasibility/prepare.py","--out",process.env.RUNNER_TEMP+"/npm-artifacts"]))')
          PYTHONPATH=src python -m brigade work verify run --target . --argv-json "$argv" --timeout 600 --capture brigade-work
      - name: Verify stable payload and packaging identities against clean source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          argv=$(node -e 'process.stdout.write(JSON.stringify(["python","npm/feasibility/prepare.py","--verify-artifacts",process.env.RUNNER_TEMP+"/npm-artifacts"]))')
          PYTHONPATH=src python -m brigade work verify run --target . --argv-json "$argv" --timeout 120 --capture brigade-work
      - name: Verify release-generated manifest attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest="$RUNNER_TEMP/npm-artifacts/build/component-manifest-v1.json"
          # The release was attested under the repository name it recorded (one of the two accepted
          # names), so the signer workflow follows the manifest, not a fixed slug.
          repository=$(python scripts/verify_component_manifest_provenance.py --manifest "$manifest" --print-repository)
          gh attestation verify "$manifest" --repo "$repository" --signer-workflow "$repository/.github/workflows/publish.yml" --format json > "$RUNNER_TEMP/attestation.json"
          # A name is only a label: require the certificate to name the Brigade repository ID.
          python scripts/verify_component_manifest_provenance.py --check-attestation-json "$RUNNER_TEMP/attestation.json"
      # Retained artifacts in this public repository are public, not confidential.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stable-npm-release-archives
          path: |
            ${{ runner.temp }}/npm-artifacts/*.tgz
            ${{ runner.temp }}/npm-artifacts/artifacts.json
            ${{ runner.temp }}/npm-artifacts/runtime.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload bounded package verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stable-npm-release-package-receipts
          path: |
            .brigade/work/verify-runs/*/receipt.json
            .brigade/work/verify-runs/*/command-*-stdout.log
            .brigade/work/verify-runs/*/command-*-stderr.log
          retention-days: 14
          if-no-files-found: warn

  acceptance:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64}
          - {os: ubuntu-24.04-arm, platform: linux-arm64}
          - {os: windows-2022, platform: win32-x64}
          - {os: macos-15-intel, platform: darwin-x64}
          - {os: macos-15, platform: darwin-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
      - name: Pin npm archive and provenance toolchain
        run: |
          npm install --global npm@11.19.1 --ignore-scripts
          test "$(node --version)" = v24.22.0
          test "$(npm --version)" = 11.19.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stable-npm-release-archives
          path: ${{ runner.temp }}/npm-artifacts
      - name: Verify stable payload and packaging identities against clean source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          argv=$(node -e 'process.stdout.write(JSON.stringify(["python","npm/feasibility/prepare.py","--verify-artifacts",process.env.RUNNER_TEMP+"/npm-artifacts"]))')
          PYTHONPATH=src python -m brigade work verify run --target . --argv-json "$argv" --timeout 120 --capture brigade-work
      - name: Full native npm and npx acceptance with fresh private HOME and Node-only PATH
        run: |
          argv=$(node -e 'process.stdout.write(JSON.stringify(["node","npm/feasibility/acceptance.cjs","--artifacts",process.env.RUNNER_TEMP+"/npm-artifacts","--out",process.env.RUNNER_TEMP+"/npm-receipts","--expected-platform","${{ matrix.platform }}"]))')
          PYTHONPATH=src python -m brigade work verify run --target . --argv-json "$argv" --timeout 900 --capture brigade-work
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'npm-receipts/acceptance.json').read_text())
          assert result['status'] == result['cancellationGate'] == 'passed'
          assert result['platform'] == result['expectedPlatform']
          assert result['acceptanceMode'] == 'native-default'
          assert result['nodeVersion'] == 'v24.22.0'
          assert result['npmVersion'] == '11.19.1'
          if result['platform'] != 'win32-x64':
              assert len(result['cancellationModes']) == 6
              assert {m['signal'] for m in result['cancellationModes']} == {'SIGINT', 'SIGTERM', 'SIGHUP'}
              assert {m['scope'] for m in result['cancellationModes']} == {'pid', 'group'}
          assert result['pathExcludesPythonAndUv'] and result['pathEntries'] == []
          if result['platform'] == 'win32-x64':
              print('Windows forced taskkill tree proof is separate; console Ctrl+C remains unproved.')
          PYCODE
      - name: Upload bounded native acceptance receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stable-npm-release-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/npm-receipts/acceptance.json
            .brigade/work/verify-runs/*/receipt.json
            .brigade/work/verify-runs/*/command-*-stdout.log
            .brigade/work/verify-runs/*/command-*-stderr.log
          retention-days: 14
          if-no-files-found: warn

  publish:
    needs: [build, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
      - name: Pin npm archive and provenance toolchain
        run: |
          npm install --global npm@11.19.1 --ignore-scripts
          test "$(node --version)" = v24.22.0
          test "$(npm --version)" = 11.19.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stable-npm-release-archives
          path: ${{ runner.temp }}/npm-artifacts
      - name: Bind original archives to exact main source before registry writes
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$RELEASE_TAG" = v0.31.0
          argv=$(node -e 'process.stdout.write(JSON.stringify(["python","npm/feasibility/prepare.py","--verify-artifacts",process.env.RUNNER_TEMP+"/npm-artifacts"]))')
          PYTHONPATH=src python -m brigade work verify run --target . --argv-json "$argv" --timeout 120 --capture brigade-work
      - name: Publish original companions then launcher with mandatory provenance
        run: |
          argv=$(node -e 'process.stdout.write(JSON.stringify(["node","npm/feasibility/publish.cjs","--artifacts",process.env.RUNNER_TEMP+"/npm-artifacts"]))')
          PYTHONPATH=src python -m brigade work verify run --target . --argv-json "$argv" --timeout 6300 --capture brigade-work
      - name: Retain publisher verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stable-npm-publisher-receipts
          path: |
            .brigade/work/verify-runs/*/receipt.json
            .brigade/work/verify-runs/*/command-*-stdout.log
            .brigade/work/verify-runs/*/command-*-stderr.log
          retention-days: 14
          if-no-files-found: warn

  registry-acceptance:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64}
          - {os: ubuntu-24.04-arm, platform: linux-arm64}
          - {os: windows-2022, platform: win32-x64}
          - {os: macos-15-intel, platform: darwin-x64}
          - {os: macos-15, platform: darwin-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
      - name: Pin npm archive and provenance toolchain
        run: |
          npm install --global npm@11.19.1 --ignore-scripts
          test "$(node --version)" = v24.22.0
          test "$(npm --version)" = 11.19.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stable-npm-release-archives
          path: ${{ runner.temp }}/npm-artifacts
      - name: Verify stable payload and packaging identities against clean source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          argv=$(node -e 'process.stdout.write(JSON.stringify(["python","npm/feasibility/prepare.py","--verify-artifacts",process.env.RUNNER_TEMP+"/npm-artifacts"]))')
          PYTHONPATH=src python -m brigade work verify run --target . --argv-json "$argv" --timeout 120 --capture brigade-work
      - name: Full native npm and npx acceptance with fresh private HOME and Node-only PATH
        run: |
          argv=$(node -e 'process.stdout.write(JSON.stringify(["node","npm/feasibility/acceptance.cjs","--artifacts",process.env.RUNNER_TEMP+"/npm-artifacts","--out",process.env.RUNNER_TEMP+"/npm-receipts","--expected-platform","${{ matrix.platform }}","--registry-spec","brigadestack@0.31.0"]))')
          PYTHONPATH=src python -m brigade work verify run --target . --argv-json "$argv" --timeout 900 --capture brigade-work
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'npm-receipts/acceptance.json').read_text())
          assert result['status'] == result['cancellationGate'] == 'passed'
          assert result['platform'] == result['expectedPlatform']
          assert result['acceptanceMode'] == 'native-default'
          assert result['nodeVersion'] == 'v24.22.0'
          assert result['npmVersion'] == '11.19.1'
          assert result['distributionMode'] == 'registry'
          assert any(c['name'] == 'npm-audit-signatures' for c in result['checks'])
          if result['platform'] != 'win32-x64':
              assert len(result['cancellationModes']) == 6
              assert {m['signal'] for m in result['cancellationModes']} == {'SIGINT', 'SIGTERM', 'SIGHUP'}
              assert {m['scope'] for m in result['cancellationModes']} == {'pid', 'group'}
          assert result['pathExcludesPythonAndUv'] and result['pathEntries'] == []
          if result['platform'] == 'win32-x64':
              print('Windows forced taskkill tree proof is separate; console Ctrl+C remains unproved.')
          PYCODE
      - name: Upload bounded native acceptance receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stable-npm-registry-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/npm-receipts/acceptance.json
            .brigade/work/verify-runs/*/receipt.json
            .brigade/work/verify-runs/*/command-*-stdout.log
            .brigade/work/verify-runs/*/command-*-stderr.log
          retention-days: 14
          if-no-files-found: warn

  # @escoffier-labs/brigade is the compatibility package: it depends on exactly the
  # brigadestack version this run published, so it publishes last, only after the
  # registry copy of brigadestack passed native acceptance. It uses this workflow's
  # existing npm trust entry, so renaming this file or the npm environment breaks it.
  publish-compat:
    needs: [build, registry-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      COMPAT_DIR: distribution/escoffier-labs-brigade/npm
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
      - name: Pin npm archive and provenance toolchain
        run: |
          npm install --global npm@11.19.1 --ignore-scripts
          test "$(node --version)" = v24.22.0
          test "$(npm --version)" = 11.19.1
      - name: Bind to the exact main source before registry writes
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Read compatibility identity and require the exact brigadestack pin
        id: identity
        run: |
          version=$(node - "$COMPAT_DIR/package.json" npm/feasibility/runtime.json <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const runtime = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          assert.equal(manifest.name, '@escoffier-labs/brigade');
          assert.match(manifest.version, /^\d+\.\d+\.\d+$/, 'compatibility package publishes stable versions only');
          assert.equal(manifest.version, runtime.version, 'compatibility version must equal the brigadestack version this run published');
          assert.deepEqual(manifest.dependencies, {brigadestack: manifest.version});
          assert.deepEqual(manifest.bin, {brigade: 'launcher.cjs'});
          assert.deepEqual(manifest.files, ['launcher.cjs', 'README.md', 'LICENSE']);
          process.stdout.write(manifest.version);
          JS
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "@escoffier-labs/brigade@$version depends on brigadestack@$version"
      - name: Require the published dependency and a new compatibility version above latest
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          test "$(npm view "brigadestack@$VERSION" version)" = "$VERSION"
          versions=$(npm view @escoffier-labs/brigade versions --json)
          latest=$(npm view @escoffier-labs/brigade dist-tags.latest)
          node - "$VERSION" "$versions" "$latest" <<'JS'
          const [version, versionsJson, latest] = process.argv.slice(2);
          // npm prints a bare string instead of an array when only one version exists.
          if ([].concat(JSON.parse(versionsJson)).includes(version)) {
            console.log(`::error::@escoffier-labs/brigade@${version} is already on npm; bump ${process.env.COMPAT_DIR} first`);
            process.exit(1);
          }
          if (!/^\d+\.\d+\.\d+/.test(latest)) {
            console.log(`::error::cannot read the current @escoffier-labs/brigade latest dist-tag (got '${latest}')`);
            process.exit(1);
          }
          const triple = v => v.split(/[.-]/).slice(0, 3).map(Number);
          const [a, b] = [triple(version), triple(latest)];
          if ((a[0] - b[0] || a[1] - b[1] || a[2] - b[2]) <= 0) {
            console.log(`::error::@escoffier-labs/brigade@${version} is not above latest ${latest}; publishing it with --tag latest would move latest backwards`);
            process.exit(1);
          }
          JS
      - name: Run compatibility launcher contract tests
        working-directory: ${{ env.COMPAT_DIR }}
        run: node --test launcher.test.cjs
      - name: Pack and check the compatibility-only payload
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          out="$RUNNER_TEMP/escoffier-brigade-npm"
          mkdir -p "$out"
          (cd "$COMPAT_DIR" && npm pack --ignore-scripts --pack-destination "$out")
          test "$(ls "$out")" = "escoffier-labs-brigade-$VERSION.tgz"
          entries=$(tar -tzf "$out/escoffier-labs-brigade-$VERSION.tgz" | LC_ALL=C sort | tr '\n' ' ')
          test "$entries" = 'package/LICENSE package/README.md package/launcher.cjs package/package.json '
      - name: Install the tarball with its real dependency and exercise the command
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          prefix="$RUNNER_TEMP/escoffier-brigade-smoke"
          npm install --global --prefix "$prefix" "$RUNNER_TEMP/escoffier-brigade-npm/escoffier-labs-brigade-$VERSION.tgz"
          cd "$RUNNER_TEMP"
          reported=$("$prefix/bin/brigade" --version)
          printf '%s\n' "$reported"
          test "$reported" = "brigade $VERSION"
          "$prefix/bin/brigade" --help
      - name: Publish the checked tarball with provenance
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: npm publish "$RUNNER_TEMP/escoffier-brigade-npm/escoffier-labs-brigade-$VERSION.tgz" --provenance --access public --tag latest --ignore-scripts
      - name: Confirm the registry serves the new version as latest
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if test "$(npm view @escoffier-labs/brigade dist-tags.latest 2>/dev/null)" = "$VERSION"; then
              npm view "@escoffier-labs/brigade@$VERSION" name version dependencies dist.integrity
              exit 0
            fi
            sleep 10
          done
          echo "::error::@escoffier-labs/brigade latest did not reach $VERSION"
          exit 1

  release-gate:
    if: always()
    needs: [build, acceptance, publish, registry-acceptance, publish-compat]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require original artifacts and every native acceptance gate
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          REGISTRY_RESULT: ${{ needs.registry-acceptance.result }}
          COMPAT_RESULT: ${{ needs.publish-compat.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$ACCEPTANCE_RESULT" = success
          test "$PUBLISH_RESULT" = success
          test "$REGISTRY_RESULT" = success
          test "$COMPAT_RESULT" = success
