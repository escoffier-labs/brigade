name: fleet-hub-container-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-hub-container-nightly-main
  cancel-in-progress: false

jobs:
  fleet-hub-container:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Fleet Hub container (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and exercise the container image
        run: python tests/fleet_hub_container_smoke.py --platform "${{ matrix.platform }}"
