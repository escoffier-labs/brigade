# Run the pull request check from the default branch so a PR cannot change its own guard.
# Never check out, import, or execute anything from the pull request.
name: Workflow guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  clear-approval:
    if: github.event_name == 'pull_request_target' && github.run_attempt == '1' && github.event.action == 'synchronize'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Clear the approval label on push
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: python3 scripts/workflow_guard.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --clear-approval

  record-approval:
    # Re-running a check must not replay a past approval or revocation.
    if: >-
      github.event_name == 'pull_request_target' && github.run_attempt == '1' &&
      github.event.label.name == 'workflow-change-approved' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled')
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: workflow-guard-record-approval-${{ github.event.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record approval for the event's head commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: python3 scripts/workflow_guard.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --record-approval

  workflow-guard:
    # This name is the required status check contract.
    name: workflow-guard
    needs: [clear-approval, record-approval]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    # Keep concurrency on the read-only job so approval writes are not cancelled here.
    concurrency:
      group: workflow-guard-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check changed CI files
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          APPROVAL_RECORD_RESULT: ${{ needs.record-approval.result }}
        run: python3 scripts/workflow_guard.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"
      - name: Report merge queue result
        if: github.event_name == 'merge_group'
        run: echo "Reporting workflow-guard for the merge group. Changed paths are checked on pull request events."
