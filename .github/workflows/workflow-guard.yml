# Run the pull request check from the default branch so a PR cannot change its own guard.
# Never check out, import, or execute anything from the pull request.
name: Workflow guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  clear-approval:
    if: github.run_attempt == '1' && github.event.action == 'synchronize'
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Clear the approval label on push
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if response=$(gh api --include --silent -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/workflow-change-approved" 2>/dev/null); then
            exit 0
          fi
          if [[ $response =~ ^HTTP/[^[:space:]]+[[:space:]]404([[:space:]]|$) ]]; then
            exit 0
          fi
          echo "Could not clear the workflow approval label." >&2
          exit 1

  record-approval:
    # Re-running a check must not replay a past approval or revocation.
    if: >-
      github.run_attempt == '1' && github.event.label.name == 'workflow-change-approved' &&
      (github.event.action == 'unlabeled' ||
      (github.event.action == 'labeled' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch))
    permissions:
      pull-requests: read
      statuses: write
    concurrency:
      group: workflow-guard-record-approval-${{ github.event.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Record approval for the event's head commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          if [[ ! $PR_HEAD_SHA =~ ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$ ]]; then
            echo "Invalid pull request head commit." >&2
            exit 1
          fi
          if [[ ! $PR_NUMBER =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request number." >&2
            exit 2
          fi
          state=failure
          description="pull request $PR_NUMBER approval removed"
          case "$PR_ACTION" in
            labeled)
              labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels?per_page=100" --paginate --slurp) || exit 2
              present=$(jq -er '
                if type == "array" and length > 0 and all(.[]; type == "array") then
                  [ .[][] | if (.name | type) == "string" then .name else error("Invalid label") end ]
                  | any(. == "workflow-change-approved") | tostring
                else error("Invalid label pages")
                end
              ' <<< "$labels") || exit 2
              if [[ $present == true ]]; then
                state=success
                description="pull request $PR_NUMBER approved"
              fi
              ;;
            unlabeled) ;;
            *) exit 1 ;;
          esac
          gh api --silent -X POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
            -f context=workflow-change-approved -f state="$state" -f description="$description" || exit 2

  workflow-guard:
    # This name is the required status check contract.
    name: workflow-guard
    needs: [clear-approval, record-approval]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    # Keep concurrency on the read-only job so approval writes are not cancelled here.
    concurrency:
      group: workflow-guard-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check changed CI files
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          APPROVAL_RECORD_RESULT: ${{ needs.record-approval.result }}
        run: python3 scripts/workflow_guard.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"
      - name: Report merge queue result
        if: github.event_name == 'merge_group'
        run: echo "Reporting workflow-guard for the merge group. Changed paths are checked on pull request events."
