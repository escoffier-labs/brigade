name: windows-observe

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-observe-main
  cancel-in-progress: false

jobs:
  windows-pytest:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: cmd
    steps:
      - name: Capture job budget
        shell: pwsh
        run: |
          "WINDOWS_PYTEST_JOB_STARTED_AT=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip || exit /b 1
          python -m pip install -e ".[dev]"
      - name: Observe full Windows suite
        timeout-minutes: 85
        run: python scripts/windows_pytest.py --record "%RUNNER_TEMP%\windows-pytest-results\summary.json" --job-started-at "%WINDOWS_PYTEST_JOB_STARTED_AT%" --job-limit 5400 --startup-reserve 120 --finalize-reserve 300 --job-timeout 5100 --serial test_runs_serve.py --serial test_aboyeur.py
      - name: Upload per-file pytest results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-pytest-results
          path: ${{ runner.temp }}/windows-pytest-results
          if-no-files-found: warn
          retention-days: 7
