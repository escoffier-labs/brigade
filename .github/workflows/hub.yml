name: Hub
# Reusable workflow: ci.yml calls it as the hub-rust job so ci-gate covers it.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  hub:
    name: hub (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    # A caller job that uses a reusable workflow cannot set timeout-minutes,
    # so the limits live here. Measured 2026-11-05 to 11-09: max 15.2 min.
    timeout-minutes: 45
    strategy:
      matrix:
        toolchain: [stable, '1.85.0']
    defaults:
      run:
        working-directory: engines/hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e ../..
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engines/hub
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Memory scan bundle matches the guard and connector rules
        run: python ../../scripts/memory_scan_bundle.py --check
      - name: Missing memory scanner fails closed
        run: |
          CARGO_TARGET_DIR=/tmp/hub-no-scan cargo build --locked --no-default-features
          BRIGADE_HUB_BINARY=/tmp/hub-no-scan/debug/brigade-hub python tests/memory_scan_unavailable.py
      - name: Ops authentication and shadow housekeeping
        run: python tests/ops.py
      - name: Development load harness unit tests
        run: python -m unittest discover -s bench -p 'test_*.py'
      - name: Proxy transport integration
        run: python tests/transport.py
      - name: Lazy schema through managed front and restart
        run: python tests/lazy_schema.py
      - name: Front admission through HTTPS
        run: python tests/admission.py
      - name: V1 claim client failure modes
        run: python tests/claims.py
      - name: Credential body share memory peak
        run: python tests/memory_peak.py
      - name: Native registration wire parity and revocation
        run: python tests/registration.py
      - name: Memory route availability and restart
        run: python tests/memory.py
      - name: Compose setup's hybrid configuration starts the hub (#2467)
        run: python tests/setup_config.py
      - name: Python hub memory client against native memory
        run: python tests/memory_client.py
      - name: Native claims wire parity, fencing and contention
        run: python tests/claims_native.py
      - name: Native messages byte parity and long polls
        run: python tests/messages_native.py
      - name: Native heartbeat wire and storage parity
        run: python tests/heartbeat_native.py
      - name: Native writes continue while the managed upstream crashes (S10)
        env:
          BRIGADE_HUB_BINARY: ${{ github.workspace }}/engines/hub/target/release/brigade-hub
        run: python tests/upstream_restart.py -v
      - name: Rollback from the Rust engine to the Python engine (S10)
        env:
          BRIGADE_HUB_BINARY: ${{ github.workspace }}/engines/hub/target/release/brigade-hub
        run: python tests/engine_rollback.py -v
      - name: Pre-publication acceptance through fleet serve --engine rust (S10)
        env:
          BRIGADE_HUB_BINARY: ${{ github.workspace }}/engines/hub/target/release/brigade-hub
        run: python tests/prepublish.py -v
      - name: Frozen wire contract through managed front
        working-directory: .
        run: >-
          python registry/skills/verify-brigade/control-brigade.py hub-contract
          --hub-cmd '${{ github.workspace }}/engines/hub/target/release/brigade-hub --host {host} --port {port} --db {db} --token-file {token_file} --route-mode registration=native --route-mode claims=native --route-mode messages=native --route-mode heartbeat=native'
          --clock-hub-cmd '${{ github.workspace }}/engines/hub/target/release/brigade-hub --host {host} --port {port} --db {db} --token-file {token_file} --route-mode registration=native --route-mode claims=native --route-mode messages=native --route-mode heartbeat=native --test-clock-file {clock_file}'
      - name: Native registration, heartbeat, claims and messages storage parity
        working-directory: .
        run: >-
          python registry/skills/verify-brigade/control-brigade.py storage-parity
          --hub-cmd '${{ github.workspace }}/engines/hub/target/release/brigade-hub --host {host} --port {port} --db {db} --token-file {token_file} --route-mode registration=native --route-mode claims=native --route-mode messages=native --route-mode heartbeat=native --test-clock-file {clock_file}'
      - name: Read-only production profile audit through managed front
        working-directory: .
        run: >-
          python registry/skills/verify-brigade/control-brigade.py hub-contract --profile prod-readonly
          --hub-cmd '${{ github.workspace }}/engines/hub/target/release/brigade-hub --host {host} --port {port} --db {db} --token-file {token_file} --route-mode registration=native --route-mode claims=native --route-mode messages=native --route-mode heartbeat=native'
      - name: Memory profile through managed front
        working-directory: .
        run: >-
          python registry/skills/verify-brigade/control-brigade.py hub-contract --profile memory
          --hub-cmd '${{ github.workspace }}/engines/hub/target/release/brigade-hub --host {host} --port {port} --db {db} --token-file {token_file} --route-mode registration=native --route-mode memory=native'
      - name: Memory profile on a hub without memory
        working-directory: .
        run: >-
          python registry/skills/verify-brigade/control-brigade.py hub-contract --profile memory --memory-absent
          --hub-cmd '${{ github.workspace }}/engines/hub/target/release/brigade-hub --host {host} --port {port} --db {db} --token-file {token_file} --route-mode registration=native'

  hub-arm64:
    # The release ships brigade-hub for linux-amd64 (the job above) and
    # linux-arm64. Build the second target on its own runner and run the
    # pre-publication acceptance there, as the release job does.
    name: hub (linux-arm64)
    runs-on: ubuntu-24.04-arm
    # Measured max 2.1 min with a warm cache; a cold release build is longer.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engines/hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e ../..
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engines/hub
      - run: cargo build --locked --release --bin brigade-hub
      - name: Pre-publication acceptance through fleet serve --engine rust
        env:
          BRIGADE_HUB_BINARY: ${{ github.workspace }}/engines/hub/target/release/brigade-hub
        run: python tests/prepublish.py -v
