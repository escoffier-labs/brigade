name: Hub
on:
  push:
    branches: [main]
    paths: ['engines/hub/**', '.github/workflows/hub.yml']
  pull_request:
    paths: ['engines/hub/**', '.github/workflows/hub.yml']
permissions:
  contents: read
jobs:
  hub:
    name: hub (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, '1.85.0']
    defaults:
      run:
        working-directory: engines/hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e ../..
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/hub
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
