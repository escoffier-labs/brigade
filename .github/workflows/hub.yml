name: Hub
on:
  push:
    branches: [main]
    paths: ['engines/hub/**', 'src/brigade/fleet_hub_server.py', 'tests/test_fleet_hub_server.py', 'registry/skills/verify-brigade/hub_contract*', '.github/workflows/hub.yml']
  pull_request:
    paths: ['engines/hub/**', 'src/brigade/fleet_hub_server.py', 'tests/test_fleet_hub_server.py', 'registry/skills/verify-brigade/hub_contract*', '.github/workflows/hub.yml']
permissions:
  contents: read
jobs:
  hub:
    name: hub (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, '1.85.0']
    defaults:
      run:
        working-directory: engines/hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e ../..
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/hub
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Proxy transport integration
        run: python tests/transport.py
      - name: Frozen wire contract through managed front
        working-directory: .
        run: >-
          python registry/skills/verify-brigade/control-brigade.py hub-contract
          --hub-cmd 'engines/hub/target/release/brigade-hub --host {host} --port {port} --db {db} --token-file {token_file}'
