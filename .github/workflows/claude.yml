name: claude

# Runs Claude Code when a trusted account mentions @claude on an issue or pull
# request. The repository is public, so only owners, organization members and
# collaborators can trigger a run, and the session is review-only: it can read
# the code and comment, but file edits and pushes are disallowed.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # issue_comment runs in the base-repo context, so a top-level @claude comment works on
    # fork PRs too. Inline and review-body events on fork PRs get no secrets, so they only
    # run for same-repo branches; on a fork PR, mention @claude in a top-level comment.
    if: >-
      (
        github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review_comment'
        && github.event.pull_request.head.repo.full_name == github.repository
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review'
        && github.event.pull_request.head.repo.full_name == github.repository
        && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # v1, pinned to the tag's commit.
      - uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --model claude-opus-5-5
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(git push:*),Bash(git commit:*)"
