<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="title desc">
  <title id="title">One list of MCP servers and skills, written to each tool</title>
  <desc id="desc">The catalog .brigade/mcp.json and the reviewed skill registry are each kept once. brigadestack mcp sync and brigadestack skills sync --target all each preview the change, and write it with --write, for Claude Code (.mcp.json, .claude/skills), Codex (.codex/config.toml, .codex/skills), Cursor (.cursor/mcp.json, .cursor/skills) and OpenCode (opencode.json, .opencode/skills).</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#202428"/></pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="m"><rect width="880" height="380" fill="url(#fade)"/></mask>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="379" rx="10" fill="#0f1215" stroke="#202428"/>
  <rect width="880" height="380" fill="url(#dots)" mask="url(#m)"/>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5">
    <g fill="none" stroke="#2e3338"><path d="M290 128.0 C400 128.0 500 71 590 71"/><path d="M290 128.0 C400 128.0 500 145 590 145"/><path d="M290 128.0 C400 128.0 500 219 590 219"/><path d="M290 128.0 C400 128.0 500 293 590 293"/><path d="M290 270.0 C400 270.0 500 85 590 85"/><path d="M290 270.0 C400 270.0 500 159 590 159"/><path d="M290 270.0 C400 270.0 500 233 590 233"/><path d="M290 270.0 C400 270.0 500 307 590 307"/></g>
    <g fill="#6d8cff"><circle cx="423.3" cy="106.3" r="2.2"/><circle cx="483.1" cy="189.6" r="2.2"/><circle cx="453.5" cy="211.2" r="2.2"/><circle cx="512.0" cy="299.9" r="2.2"/></g>
    <rect x="40" y="72" width="250" height="112" rx="8" fill="#0a0c0e" stroke="#2e3338"/><text x="56" y="99" fill="#e9ecef" font-size="13.5">.brigade/mcp.json</text><path d="M40 114.5H290" stroke="#202428"/><text x="56" y="135" fill="#929aa3">MCP servers</text><text x="274" y="135" text-anchor="end" fill="#a1a8b0">listed once</text><text x="56" y="156" fill="#929aa3">$ brigadestack mcp sync</text>
    <rect x="40" y="214" width="250" height="112" rx="8" fill="#0a0c0e" stroke="#2e3338"/><text x="56" y="241" fill="#e9ecef" font-size="13.5">skill registry</text><path d="M40 256.5H290" stroke="#202428"/><text x="56" y="277" fill="#929aa3">Skills</text><text x="274" y="277" text-anchor="end" fill="#a1a8b0">reviewed once</text><text x="56" y="298" fill="#929aa3">$ brigadestack skills sync</text><text x="56" y="314" fill="#929aa3">  --target all</text>
    <rect x="590" y="56" width="44" height="44" rx="8" fill="#fff" stroke="#2e3338"/><image href="data:image/svg+xml;base64," x="600" y="66" width="24" height="24"/>
    <text x="648" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#a1a8b0">Claude Code</text><text x="648" y="87" fill="#929aa3">.mcp.json</text><text x="648" y="104" fill="#929aa3">.claude/skills/</text>
    <rect x="590" y="130" width="44" height="44" rx="8" fill="#fff" stroke="#2e3338"/><image href="data:image/svg+xml;base64," x="600" y="140" width="24" height="24"/>
    <text x="648" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#a1a8b0">Codex</text><text x="648" y="161" fill="#929aa3">.codex/config.toml</text><text x="648" y="178" fill="#929aa3">.codex/skills/</text>
    <clipPath id="t2"><rect x="590" y="204" width="44" height="44" rx="9"/></clipPath><image href="data:image/svg+xml;base64," x="590" y="204" width="44" height="44" clip-path="url(#t2)"/>
    <text x="648" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#a1a8b0">Cursor</text><text x="648" y="235" fill="#929aa3">.cursor/mcp.json</text><text x="648" y="252" fill="#929aa3">.cursor/skills/</text>
    <clipPath id="t3"><rect x="590" y="278" width="44" height="44" rx="9"/></clipPath><image href="data:image/png;base64," x="590" y="278" width="44" height="44" clip-path="url(#t3)"/>
    <text x="648" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#a1a8b0">OpenCode</text><text x="648" y="309" fill="#929aa3">opencode.json</text><text x="648" y="326" fill="#929aa3">.opencode/skills/</text>
    <text x="40" y="46" font-size="12" fill="#929aa3">Kept once</text>
    <text x="590" y="34" font-size="12" fill="#929aa3">Written to each tool</text>
  </g>
</svg>
