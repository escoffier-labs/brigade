[package]
name = "brigade-hub"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[features]
default = ["memory-scan"]
memory-scan = ["dep:brigade-guard"]

[dependencies]
brigade-guard = { path = "../brigade-guard", optional = true }
axum = "0.8"
clap = { version = "=4.5.60", features = ["derive"] }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-rustls = { version = "=0.27.7", default-features = false, features = ["http1", "ring", "webpki-roots", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio", "service"] }
rusqlite = { version = "0.40", features = ["bundled", "hooks", "trace"] }
sha2 = "0.10"
subtle = "2.6"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "=2.4.1"

[dev-dependencies]
# Paused-clock tests only. Never in the release binary.
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
