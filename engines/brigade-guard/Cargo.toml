[package]
name = "brigade-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Optional PCRE2 JIT match engine for Brigade guard"

[dependencies]
# Exact pins, as the hub does. pcre2-sys 0.2.10 vendors PCRE2 10.46. The root
# .cargo/config.toml forces that bundled copy; see README.md.
pcre2 = "=0.2.11"
# Already linked through pcre2. Used directly only to read the linked
# library's version and Unicode database version.
pcre2-sys = "=0.2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
