# Brigade Fleet Hub, Docker Compose recipe (holder namespace layout).
#
# No service publishes a port. The holder (`netns`) owns one network
# namespace, and the hub and the private network's HTTPS front join it, so the
# hub binds loopback and its peer is the front. The embedder runs only under
# the `gpu` profile that `bin/hub-setup.py init` writes, on an internal network
# shared only with the holder. Run setup before the first `docker compose up`:
# it writes `.env`, `config/hub.toml` and the secrets this file names.
# Runbook: docs/runbooks/fleet-hub-dogfood.md. Never run `docker compose down -v`.

name: ${COMPOSE_PROJECT_NAME:-brigade-hub}

x-hardening: &hardening
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  netns:
    <<: *hardening
    image: ${BRIGADE_HUB_IMAGE:-localhost/brigade-fleet-hub:dogfood}
    # Only a pause process. It never exits, has no health check and holds no
    # data, so the daemon has no reason to restart it and the namespace stays.
    entrypoint: ["python", "-c", "import signal; signal.pause()"]
    command: []
    healthcheck:
      disable: true
    cap_drop: [ALL]
    read_only: true
    mem_limit: 64m
    oom_score_adj: -1000
    cgroup_parent: ${BRIGADE_HUB_SLICE:-brigade-hub.slice}
    networks:
      - default
      - embed

  hub:
    <<: *hardening
    build:
      context: ../..
      dockerfile: ops/fleet-hub/Containerfile
      # The Python hub plus the brigade-hub binary, both from BRIGADE_REF.
      target: dogfood
      args:
        BRIGADE_REF: ${BRIGADE_REF:-a7746b6da2eec257890674de30635ca5036a2115}
        BRIGADE_SHA256: ${BRIGADE_SHA256:-5a0cd597e970d17eedf3597cfd33d1a909c1e8f33f9077184abb421cedf3e67f}
        BRIGADE_VERSION: ${BRIGADE_VERSION:-0.31.0}
    image: ${BRIGADE_HUB_IMAGE:-localhost/brigade-fleet-hub:dogfood}
    network_mode: "service:netns"
    depends_on:
      - netns
    # brigade-hub (the Rust hub) takes the port in managed mode and starts the
    # Python hub as its child on an ephemeral loopback port, keyed by a value
    # generated at each start. hub/entry.py execs `brigade fleet serve
    # --engine rust` (S10) when the pinned Brigade has it: that checks
    # brigade-hub against the checksum the image recorded, forwards stop
    # signals, writes the listening and clean-exit lines the S31 checks read,
    # and exits non-zero when /health fails or the namespace keeps only
    # loopback. For older refs without S10, entry.py runs its S31 wrapper.
    entrypoint: ["python", "/brigade/entry.py"]
    command:
      - --host
      - 127.0.0.1
      - --port
      - "3774"
      - --db
      - /var/lib/brigade/fleet-hub.db
      - --token-file
      - /run/secrets/admin_token
      - --trust-forwarded-proto
      # Hub memory (POST /memory) is native, in fleet-hub-memory.db beside
      # fleet-hub.db. Every other family keeps its default.
      - --route-mode
      - memory=native
      # The file bin/hub-setup.py writes, mounted below. A named file that
      # cannot be read or does not validate stops startup, and the hub's log
      # names the file it read. hub/entry.py drops this flag, with a warning,
      # for an image whose Brigade predates it.
      - --memory-config
      - /etc/brigade/hub.toml
    environment:
      BRIGADE_FLEET_FINDINGS_KEY_FILE: /run/secrets/findings_key
      # With the Rust engine, its watchdog also exits when the holder
      # restarted and this namespace kept only loopback.
      BRIGADE_HUB_WATCHDOG_NETNS: "1"
    secrets:
      - admin_token
      - findings_key
    volumes:
      - brigade-state:/var/lib/brigade
      # Setup's retrieval mode and embedder table, named by --memory-config.
      - ./config/hub.toml:/etc/brigade/hub.toml:ro
      - ./hub:/brigade:ro
    # Private to this container and gone when it stops. hub/entry.py puts the
    # hub's own mode-0400 copy of the embedder token here, because the hub
    # refuses a token file another user owns and a secret bind mount keeps the
    # operator's ownership. UID and GID 10001 are the image's hub user.
    tmpfs:
      - /run/brigade:mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    # Covers brigade-hub's drain of at most 25 s and then up to 10 s for the
    # Python upstream's own shutdown after its SIGTERM.
    # The Docker daemon's own shutdown timeout must be at least this.
    stop_grace_period: 40s
    oom_score_adj: -900
    cgroup_parent: ${BRIGADE_HUB_SLICE:-brigade-hub.slice}
    # Status only: Docker never restarts an unhealthy container. The host
    # watchdog timer (systemd/brigade-hub-watchdog.timer) acts on failures.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3774/health', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  front:
    <<: *hardening
    image: ${BRIGADE_FRONT_IMAGE:-tailscale/tailscale:v1.88.4@sha256:360e10ad95ad03950f66df03e0dab66287f9f89076ee4012d50bc6adceafcdf3}
    network_mode: "service:netns"
    depends_on:
      - netns
      - hub
    # The wrapper exits after 3 checks that find only loopback, or 3 checks in
    # which the hub port refuses connections, so the restart policy starts the
    # front again in the holder's current namespace.
    entrypoint: ["/bin/sh", "/brigade/front-wrapper.sh"]
    environment:
      TS_HOSTNAME: ${BRIGADE_FRONT_HOSTNAME:-brigade-hub-dogfood}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_AUTH_ONCE: "true"
      # SSH stays off: a remote shell into the front would sit in the hub's namespace.
      TS_EXTRA_ARGS: --ssh=false
      TS_SERVE_CONFIG: /brigade/serve.json
      BRIGADE_FRONT_AUTHKEY_FILE: /run/secrets/front_authkey
    secrets:
      - front_authkey
    volumes:
      - front-state:/var/lib/tailscale
      - ./front:/brigade:ro
    cap_drop: [ALL]
    mem_limit: 256m
    oom_score_adj: -500
    cgroup_parent: ${BRIGADE_HUB_SLICE:-brigade-hub.slice}

  embedder:
    <<: *hardening
    profiles: [gpu]
    image: ${BRIGADE_EMBED_IMAGE:-ollama/ollama:0.18.0@sha256:e23e6499890325d31f3454cdc83f7a613a2423c8a9e167bbafea0b0e3c27d7c6}
    environment:
      # Reachable only on the internal network; no port is published.
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NOPRUNE: "1"
      OLLAMA_MODELS: /models
    volumes:
      - models:/models
    networks:
      - embed
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    oom_score_adj: -800
    cgroup_parent: ${BRIGADE_EMBED_SLICE:-brigade-embed.slice}

  # One-shot model download into the models volume. The embedder sits only on
  # the internal network and cannot reach a registry, so this runs on the
  # default network, with no GPU and no published port:
  # `docker compose --profile model-pull run --rm model-pull`.
  model-pull:
    profiles: [model-pull]
    image: ${BRIGADE_EMBED_IMAGE:-ollama/ollama:0.18.0@sha256:e23e6499890325d31f3454cdc83f7a613a2423c8a9e167bbafea0b0e3c27d7c6}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama serve >/dev/null 2>&1 & server=$$!; sleep 3; ollama pull "$$BRIGADE_EMBED_MODEL"; status=$$?; kill "$$server"; exit "$$status"
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /models
      BRIGADE_EMBED_MODEL: ${BRIGADE_EMBED_MODEL:-qwen3-embedding:8b}
    volumes:
      - models:/models
    networks:
      - default
    restart: "no"
    security_opt:
      - no-new-privileges:true

  # One-shot copy job: `docker compose --profile backup run --rm backup`,
  # started hourly by systemd/brigade-hub-backup.timer. Root inside the
  # container with three capabilities: it reads the hub's files, SQLite gives
  # any -wal or -shm file it creates the database file's owner, and the copies
  # are handed to the compose account in the 0700 backup directory.
  # hub/backup.py runs `brigade fleet backup` once per file: fleet-hub.db into
  # /backups, fleet-hub-memory.db into /backups/memory, and skips a missing
  # memory file, so it never stops the hub file's copy.
  backup:
    profiles: [backup]
    image: ${BRIGADE_HUB_IMAGE:-localhost/brigade-fleet-hub:dogfood}
    network_mode: none
    user: "0:0"
    entrypoint: ["python", "/brigade/backup.py"]
    command:
      - --dest
      - /backups
      - --owner
      - ${BRIGADE_BACKUP_OWNER:?run bin/hub-setup.py init first}
      - --keep-hourly
      - ${BRIGADE_BACKUP_KEEP_HOURLY:-48}
      - --min-free-gib
      - ${BRIGADE_BACKUP_MIN_FREE_GIB:-20}
      - --json
    volumes:
      - brigade-state:/var/lib/brigade
      - ${BRIGADE_BACKUP_DIR:?run bin/hub-setup.py init first}:/backups
      - ./hub:/brigade:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    restart: "no"
    cgroup_parent: ${BRIGADE_HUB_SLICE:-brigade-hub.slice}

networks:
  default: {}
  embed:
    internal: true

secrets:
  admin_token:
    file: ./secrets/admin-token.txt
  findings_key:
    file: ./secrets/findings-key
  front_authkey:
    file: ./secrets/front-authkey

volumes:
  brigade-state:
  front-state:
  models:
