[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brigadestack"
version = "0.30.0"
description = "Brigade Stack command alias for the stable Brigade CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["brigade-cli==0.30.0"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://brigade.tools"
Documentation = "https://brigade.tools/docs"
Repository = "https://github.com/escoffier-labs/brigade"
Source = "https://github.com/escoffier-labs/brigade/tree/main/distribution/brigadestack/pypi"
Issues = "https://github.com/escoffier-labs/brigade/issues"

[project.scripts]
brigadestack = "brigade.cli:process_main"

[tool.setuptools]
packages = []
py-modules = []
